name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal api web/embed.go)"
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - run: go test -race ./...

  # The RapidOCR service (ocr-rapid/): its unit tests, then its image's test
  # stage, which runs a smoke test with the real models.
  ocr-rapid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make test-ocr-rapid
      - run: make test-ocr-rapid-image

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  contract:
    name: generated code matches contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make generate
      - run: git diff --exit-code

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install chromium
        working-directory: e2e
      # The runner image already has Chrome's system libraries. Installing
      # them again goes through Ubuntu's mirrors, which are sometimes down;
      # that must not fail the tests.
      - run: npx playwright install-deps chromium || echo "::warning::Could not install Playwright's system dependencies; using the runner's own"
        working-directory: e2e
      - run: make test-e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Every push to main and every v* tag publishes the image and the
  # documentation, once all checks above pass.
  image:
    if: github.event_name == 'push'
    needs: [backend, ocr-rapid, frontend, contract, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main: "main" and "sha-<short>"; v1.2.3: "1.2.3", "1.2", "1" and
          # "latest" (not for pre-releases such as v1.3.0-rc.1).
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The OCR service, an optional companion image: ghcr.io/<owner>/moneyharpy-ocr.
      - id: meta-ocr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-ocr
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ocr
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ocr.outputs.tags }}
          labels: ${{ steps.meta-ocr.outputs.labels }}
          annotations: ${{ steps.meta-ocr.outputs.annotations }}
          cache-from: type=gha,scope=ocr
          cache-to: type=gha,mode=max,scope=ocr
      # The RapidOCR service, an optional companion of the OCR service:
      # ghcr.io/<owner>/moneyharpy-ocr-rapid.
      - id: meta-ocr-rapid
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-ocr-rapid
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ocr-rapid
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ocr-rapid.outputs.tags }}
          labels: ${{ steps.meta-ocr-rapid.outputs.labels }}
          annotations: ${{ steps.meta-ocr-rapid.outputs.annotations }}
          cache-from: type=gha,scope=ocr-rapid
          cache-to: type=gha,mode=max,scope=ocr-rapid

  docs:
    if: github.event_name == 'push'
    needs: [backend, ocr-rapid, frontend, contract, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: npm ci
        working-directory: web
      - run: ./docs/build.sh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  pages:
    needs: docs
    runs-on: ubuntu-latest
    # One deployment at a time; a newer one replaces a waiting one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
