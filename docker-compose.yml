services:
  app:
    # The published image; MONEYHARPY_IMAGE picks another tag, such as
    # ghcr.io/adirkuhn/moneyharpy:main. "up --build" builds it from source.
    image: ${MONEYHARPY_IMAGE:-ghcr.io/adirkuhn/moneyharpy:latest}
    build: .
    environment:
      DATABASE_URL: postgres://moneyharpy:${POSTGRES_PASSWORD}@db:5432/moneyharpy?sslmode=disable
      SECRET_KEY: ${SECRET_KEY}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # Optional: without the ocr service the app still works, but reads
      # only e-invoices and previews show the file itself.
      OCR_URL: http://ocr:8090
    ports:
      - "8080:8080"
    volumes:
      # Uploads, such as logos, while no S3-compatible storage is configured.
      - uploads-data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [default, ocr]
    restart: unless-stopped

  # Reads scans and PDFs (Tesseract, Poppler) and renders page previews. It
  # needs no internet: it is only on an internal network with the app.
  ocr:
    image: ${MONEYHARPY_OCR_IMAGE:-ghcr.io/adirkuhn/moneyharpy-ocr:latest}
    build:
      context: .
      dockerfile: Dockerfile.ocr
    environment:
      # Optional: photos and short scans are also read by RapidOCR, the
      # ocr-rapid service below. Remove this line (and that service) to read
      # with Tesseract alone; when it is down, Tesseract is used anyway.
      RAPIDOCR_URL: http://ocr-rapid:8091
    networks: [ocr]
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/ocrd", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # A second OCR engine (RapidOCR: PaddleOCR's models on ONNX Runtime) that
  # reads phone photos of till receipts better. Only the ocr service talks to
  # it, on the internal network: no internet, the models are in the image.
  ocr-rapid:
    image: ${MONEYHARPY_OCR_RAPID_IMAGE:-ghcr.io/adirkuhn/moneyharpy-ocr-rapid:latest}
    build:
      context: .
      dockerfile: Dockerfile.ocr-rapid
    networks: [ocr]
    read_only: true
    healthcheck:
      test: ["CMD", "python", "/app/main.py", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # S3-compatible file storage for uploads such as logos. Any S3 service works
  # instead; enter its details under Instance settings > File storage.
  storage:
    image: chrislusf/seaweedfs:4.52
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"moneyharpy","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -s3 -s3.port=8333 -dir=/data -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage-data:/data
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: moneyharpy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: moneyharpy
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyharpy"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

networks:
  default:
  ocr:
    internal: true

volumes:
  db-data:
  storage-data:
  uploads-data:
