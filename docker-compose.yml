services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://moneyharpy:${POSTGRES_PASSWORD}@db:5432/moneyharpy?sslmode=disable
      SECRET_KEY: ${SECRET_KEY}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: moneyharpy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: moneyharpy
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyharpy"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  db-data:
