# Disposable stack for the end-to-end tests: docker compose -p moneyharpy-e2e
services:
  app:
    build: ..
    environment:
      DATABASE_URL: postgres://moneyharpy:e2e-password@db:5432/moneyharpy?sslmode=disable
      SECRET_KEY: e2e-only-secret-key-not-used-anywhere-else
      BASE_URL: http://localhost:18080
      # Lets each test act as its own client, so real rate limits stay on.
      TRUST_PROXY_HEADERS: "true"
      OCR_URL: http://ocr:8090
    ports:
      - "18080:8080"
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
  # Without ocr-rapid (RAPIDOCR_URL): no test reads a photo or a scan, so
  # it would only slow the stack down. cmd/ocrd's tests cover asking it, and
  # building its image runs a smoke test with the real models (make
  # test-ocr-rapid-image).
  ocr:
    build:
      context: ..
      dockerfile: Dockerfile.ocr
    tmpfs:
      - /tmp
  storage:
    image: chrislusf/seaweedfs:4.52
    command: ["server", "-s3", "-s3.port=8333", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - ../internal/objectstore/testdata/s3.json:/etc/seaweedfs/s3.json:ro
    tmpfs:
      - /data
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "18025:8025"
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: moneyharpy
      POSTGRES_PASSWORD: e2e-password
      POSTGRES_DB: moneyharpy
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyharpy"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  uploads-data:
