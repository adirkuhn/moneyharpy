        - $ref: '#/components/schemas/task_list_group_response'
        - type: object
          required: [id, name, row_order, report_type, tasks]
    TaskListTask:
      description: A Moneybird task of a task list.
      allOf:
        - $ref: '#/components/schemas/task_list_task_response'
        - type: object
          required: [id, administration_id, name, description, row_order, completed_at, report_type, task_lists_group_id, parent_task_id,
                     assignee_id, subtasks, notes, events]
          properties:
            related_entity_id:
              description: MoneyHarpy extension. The category (ledger account) the task is about.
              $ref: '#/components/schemas/identifier_nullable'
            generated:
              type: boolean
              description: MoneyHarpy extension. Generated from a report or a category; such tasks cannot be deleted.
    TaskListTemplate:
      description: A Moneybird task list template with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/task_list_template_response'
        - type: object
          required: [id, administration_id, name, description, period, deadline_after, groups, uri]
          properties:
            uri:
              type: string
              description: MoneyHarpy extension. Canonical path of this resource.
    TaskListRequest:
      type: object
      additionalProperties: false
      properties:
        task_list:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
              description: Required on creation, unless made from a template.
            description:
              type: string
              maxLength: 10000
            deadline_on:
              type: string
              format: date
              nullable: true
            period_begin:
              type: string
              format: date
              description: On creation only.
            period_end:
              type: string
              format: date
              description: On creation only.
            template_id:
              description: The template to make the list from; on creation only.
              $ref: '#/components/schemas/FlexibleIdentifier'
    TaskListGroupRequest:
      type: object
      required: [group]
      additionalProperties: false
      properties:
        group:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
              description: Required on creation.
            report_type:
              $ref: '#/components/schemas/TaskListReportType'
    TaskListReportType:
      type: string
