            checkout_show_phone_field:
              type: boolean
              description: "MoneyHarpy extension. The checkout asks for a phone number."
            checkout_for_business:
              type: boolean
              description: "MoneyHarpy extension. The checkout starts as a business purchase, with prices excluding VAT and a company name field."
            checkout_show_identity:
              type: boolean
              description: "MoneyHarpy extension. The checkout shows the company details."
            checkout_show_withdrawal_button:
              type: boolean
              description: "MoneyHarpy extension. The checkout lets consumers withdraw a purchase within 14 days of payment."
            checkout_favorite_label:
              type: string
              maxLength: 20
              description: "MoneyHarpy extension. The label on the subscription marked as favourite."
    InvoiceSettings:
      type: object
      description: MoneyHarpy extension.
      required:
      - invoice_id_template
      - invoice_sequence_id
      - invoice_id_example
      - estimate_id_template
      - estimate_sequence_id
      - estimate_id_example
      - invoice_bcc_email_address
      - invoice_reminders_bcc_enabled
      - estimate_bcc_email_address
      - order_bcc_email_address
      - default_email_ubl
      - payments_without_proof
      properties:
        invoice_id_template:
          type: string
          description: How invoice numbers are built, with tags such as {year} and the required {id}.
          example: '{year}-{id}'
        invoice_sequence_id:
          type: string
          description: The next sequence number. Leading zeros are kept.
          example: '0001'
        invoice_id_example:
          type: string
          description: The next invoice number if it were made today.
          example: 2026-0001
        estimate_id_template:
          type: string
        estimate_sequence_id:
          type: string
        estimate_id_example:
          type: string
        invoice_bcc_email_address:
          type: string
          description: Addresses, separated by commas, that get a copy of every invoice.
        invoice_reminders_bcc_enabled:
          type: boolean
          description: Also copy payment reminders to the invoice addresses.
        estimate_bcc_email_address:
          type: string
        order_bcc_email_address:
          type: string
        default_email_ubl:
          type: boolean
          description: Attach a UBL file to invoices emailed to new contacts.
        payments_without_proof:
          type: boolean
          description: Allow marking invoices paid without a bank transaction.
    InvoiceSettingsRequest:
      type: object
      required:
      - invoice_settings
      additionalProperties: false
      properties:
        invoice_settings:
          type: object
          additionalProperties: false
          properties:
            invoice_id_template:
              type: string
              maxLength: 255
            invoice_sequence_id:
              type: string
              maxLength: 255
            estimate_id_template:
              type: string
              maxLength: 255
            estimate_sequence_id:
              type: string
              maxLength: 255
            invoice_bcc_email_address:
              type: string
              maxLength: 1000
            estimate_bcc_email_address:
              type: string
              maxLength: 1000
            order_bcc_email_address:
              type: string
              maxLength: 1000
            invoice_reminders_bcc_enabled:
              type: boolean
            default_email_ubl:
              type: boolean
            payments_without_proof:
              type: boolean
    CustomFieldUpdateRequest:
      type: object
      required:
      - custom_field
      additionalProperties: false
      properties:
        custom_field:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
