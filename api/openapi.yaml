        '200':
          $ref: '#/components/responses/RecurringSalesInvoicePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createRecurringSalesInvoice
      x-permissions: [sales_invoices]
      summary: Create a recurring sales invoice
      description: >-
        A template that makes a draft sales invoice on invoice_date (today unless given, not in the past) and every frequency frequency_types after it (every month unless given), until last_date or desired_count invoices; with auto_send each is sent too, the way the contact receives invoices. Months, quarters and years keep the day of the first date, or the month's last day when the month is shorter. {period} in a line's description becomes the period the invoice covers, and lines with a period get that period. Workflow, document style and identity default like a new invoice's.
      tags: [Recurring sales invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringSalesInvoiceRequest'
      responses:
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '201':
          description: The created recurring invoice
