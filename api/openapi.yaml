      required: [ledger_account]
      additionalProperties: false
      properties:
        ledger_account:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
            account_type:
              $ref: '#/components/schemas/AccountType'
            account_id:
              type: string
              maxLength: 20
              description: The account number, such as 8000.
            parent_id:
              type: string
              pattern: '^[0-9]{0,19}$'
              nullable: true
              description: Empty for none.
            active:
              type: boolean
              description: MoneyHarpy extension.
