      allOf:
        - $ref: '#/components/schemas/extended_user_response'
        - type: object
          required: [active]
          properties:
            active:
              type: boolean
              description: MoneyHarpy extension. Deactivated users cannot open the administration.
    UserRequest:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          type: object
          additionalProperties: false
          properties:
            user_type:
              $ref: '#/components/schemas/UserType'
            permissions:
              type: array
              maxItems: 7
              items:
                $ref: '#/components/schemas/Permission'
            active:
              type: boolean
    UserInvitation:
      type: object
      description: MoneyHarpy extension.
      required: [id, email, user_type, permissions, created_at, expires_at, expired]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        email:
          type: string
        user_type:
          $ref: '#/components/schemas/UserType'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        expired:
          type: boolean
    CreatedUserInvitation:
      allOf:
        - $ref: '#/components/schemas/UserInvitation'
        - type: object
          required: [accept_url, email_sent]
          properties:
            accept_url:
              type: string
              description: The link to accept, shown only now.
            email_sent:
              type: boolean
              description: False when email is off; share the link yourself.
    UserInvitationRequest:
      type: object
      required: [user_invitation]
      additionalProperties: false
      properties:
        user_invitation:
          type: object
          required: [email, user_type]
          additionalProperties: false
          properties:
            email:
              type: string
              maxLength: 254
            user_type:
              $ref: '#/components/schemas/UserType'
            permissions:
              type: array
              maxItems: 7
              description: Omit for the type's defaults.
              items:
                $ref: '#/components/schemas/Permission'
    InvitationPreview:
      type: object
      required: [administration_name, inviter_name, email, user_type, open]
      properties:
        administration_name:
          type: string
        inviter_name:
          type: string
        email:
          type: string
        user_type:
          $ref: '#/components/schemas/UserType'
        open:
          type: boolean
          description: False once accepted or expired.
    SupportAccess:
      type: object
      required: [until]
      additionalProperties: false
      properties:
        until:
          type: string
          format: date-time
          nullable: true
    SupportGrant:
      type: object
      required: [administration_id, name, until, uri]
      properties:
        administration_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        until:
          type: string
          format: date-time
        uri:
          type: string
    DeleteAdministrationRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
          description: The administration's name, exactly, to confirm.
    TwoFactorCode:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 32
          description: Six digits from the authenticator app, or a recovery code.
    TwoFactorStatus:
      type: object
      required: [enabled, required, recovery_codes_left]
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
          description: An administration you work in requires it.
        recovery_codes_left:
          type: integer
    TwoFactorSetup:
      type: object
      required: [secret, otpauth_uri, qr_svg]
      properties:
        secret:
          type: string
          description: For typing into the app, in base32.
        otpauth_uri:
          type: string
        qr_svg:
          type: string
          description: The otpauth URI as an SVG QR code.
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    TwoFactorRequired:
      type: object
      required: [two_factor_required]
      properties:
        two_factor_required:
          type: boolean
          enum: [true]
    ConnectionSettings:
      type: object
      required: [users_may_connect]
      additionalProperties: false
      properties:
        users_may_connect:
          type: boolean
          description: Users other than owners may create API tokens and AI connections.
    Connection:
      type: object
      description: MoneyHarpy extension. An API token or AI connection.
      required: [id, kind, name, scopes, read_only, granted_by, created_at, last_used_at, mine]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        kind:
          type: string
          enum: [api, ai]
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        read_only:
          type: boolean
        granted_by:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        mine:
          type: boolean
          description: You made it, so you may revoke it.
    CreatedConnection:
      allOf:
        - $ref: '#/components/schemas/Connection'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Shown only now. Send it as a bearer token.
            mcp_url:
              type: string
              description: For AI connections, the address to give the assistant.
    Scope:
      type: string
      enum: [sales_invoices, documents, estimates, bank, time_entries, settings]
    ConnectionRequest:
      type: object
      required: [connection]
      additionalProperties: false
      properties:
        connection:
          type: object
          required: [kind, name, scopes]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [api, ai]
            name:
              type: string
              maxLength: 255
            scopes:
              type: array
              maxItems: 6
              items:
                $ref: '#/components/schemas/Scope'
            read_only:
              type: boolean
    Webhook:
      description: A Moneybird webhook with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/webhook_response'
        - type: object
          required: [uri]
          properties:
            uri:
              type: string
              description: MoneyHarpy extension. Canonical path of this resource.
    WebhookRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          maxLength: 2000
        enabled_events:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 100
    WebhookEvents:
      type: object
      required: [events, groups]
      properties:
        events:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
    JsonRpcMessage:
      type: object
      description: A JSON-RPC 2.0 request or notification.
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          oneOf:
            - type: string
            - type: integer
          nullable: true
        method:
          type: string
        params:
          type: object
          additionalProperties: true
    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          oneOf:
            - type: string
            - type: integer
          nullable: true
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
            message:
              type: string
    DocumentStyleLine:
      type: object
      required:
      - field
      additionalProperties: false
      properties:
        field:
          type: string
          maxLength: 64
        bold:
          type: boolean
        italic:
          type: boolean
        label:
          type: boolean
      description: >-
        One entry of a block on a document. bold prints it bold, italic in italics; label prints its name before it.
        Custom fields are named custom_field_ followed by their id. As at Moneybird, company_website_url prints the administration's website.
    DocumentStyleRequest:
      type: object
      required:
      - document_style
      additionalProperties: false
      properties:
        document_style:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
            identity_id:
              $ref: '#/components/schemas/Identifier'
            default:
              type: boolean
            logo_container_full_width:
              type: boolean
            logo_display_width:
              type: integer
              description: Logo width in percent of the available space, 10 to 100.
            logo_position:
              type: string
              enum:
              - left
              - center
              - right
            print_on_stationery:
              type: boolean
              description: Leave the background out of PDFs because you print on pre-printed paper.
            paper_size:
              type: string
              enum:
              - A4
              - letter
            address_position:
              type: string
              enum:
              - left
              - right
            font_size:
              type: integer
              description: 8 to 14 points.
            font_family:
              type: string
              maxLength: 64
            custom_css:
              type: string
              maxLength: 20000
            invoice_sender_address: &id001
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/DocumentStyleLine'
            invoice_metadata_left: *id001
            invoice_metadata_right: *id001
            estimate_sender_address: *id001
            estimate_metadata_left: *id001
            estimate_metadata_right: *id001
            hide_sender_address:
              type: boolean
              description: "MoneyHarpy extension. Leave the sender address off invoices and quotes, for a background image that has it."
            sender_address_width:
              type: integer
              minimum: 100
              maximum: 400
              description: "MoneyHarpy extension. Width of the sender address in pixels, 100 to 400."
            show_epc_code:
              type: boolean
              description: "MoneyHarpy extension. Print a QR code (EPC) customers can pay an invoice with from their banking app."
            invoice_recipient_address:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/DocumentStyleLine'
              description: "MoneyHarpy extension. Details under the customer address on invoices: customer_tax_number, customer_chamber_of_commerce, customer_id, customer_email, customer_phone or a contact custom field (custom_field_<id>)."
            estimate_recipient_address:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/DocumentStyleLine'
              description: "MoneyHarpy extension. The same for quotes."
            email_header_type:
              type: string
              enum: ["", background_image_with_text, background_image_with_logo, background_image, background_color_with_logo, background_color_with_text]
              description: "MoneyHarpy extension. The header of emails; empty for none."
            email_header_content_position:
              type: string
              enum: [left, center, right]
              description: "MoneyHarpy extension."
            email_header_background_color:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              description: "MoneyHarpy extension."
            email_header_text:
              type: string
              maxLength: 500
              description: "MoneyHarpy extension. The text of a header with text."
            email_header_text_color:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              description: "MoneyHarpy extension."
            email_logo_display_width:
              type: integer
              minimum: 10
              maximum: 100
              description: "MoneyHarpy extension. Width of the email logo in percent, 10 to 100."
            email_footer_type:
              type: string
              enum: ["", contact_information, signature, background_image]
              description: "MoneyHarpy extension. The footer of emails; empty for none."
            email_footer_text_color:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              description: "MoneyHarpy extension."
            email_footer_background_color:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              description: "MoneyHarpy extension."
            email_footer_profile_title:
              type: string
              maxLength: 100
              description: "MoneyHarpy extension. The name in a signature footer."
            email_footer_profile_subtitle:
              type: string
              maxLength: 100
              description: "MoneyHarpy extension. The line under the name in a signature footer."
            body_background_color:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              description: "MoneyHarpy extension. The colour around the email."
            email_font_family:
              type: string
              enum: [lucida_grande, helvetica, arial, verdana, georgia, times_new_roman, courier]
              description: "MoneyHarpy extension."
            email_moneybird_label_enabled:
              type: boolean
              description: "MoneyHarpy extension. Show \"Sent with MoneyHarpy\" under emails. Named as in Moneybird's document style form."
            public_view_logo_display_size:
              type: integer
              minimum: 10
              maximum: 100
              description: "MoneyHarpy extension. Size of the public view logo in percent, 10 to 100."
            public_view_background_color:
              type: string
              enum: ['#F7F9FC', '#F6E4E2', '#EDE8F7', '#D5E8FA', '#DEF4F8', '#FBE0D5', '#FCF1DB', '#D7ECEA', '#E7F3E6', '#E4E9EB']
              description: "MoneyHarpy extension. The page colour of public views."
            public_view_moneybird_label_enabled:
              type: boolean
              description: "MoneyHarpy extension. Show \"Made with MoneyHarpy\" on public views. Named as in Moneybird's document style form."
            checkout_show_address:
              type: boolean
