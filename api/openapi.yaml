        - $ref: '#/components/schemas/taxonomy_item_response'
        - type: object
          required: [level, side]
          properties:
            description:
              type: string
              nullable: true
            level:
              type: integer
              description: MoneyHarpy extension. Depth in the scheme, from 1.
            side:
              type: string
              enum: [balance_sheet, profit_and_loss]
              description: MoneyHarpy extension.
    LedgerAccount:
