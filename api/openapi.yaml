          writeOnly: true
          maxLength: 1024
        smtp_from:
          type: string
          maxLength: 320
        smtp_security:
          type: string
          enum: [starttls, tls, none]
        storage_enabled:
          type: boolean
        storage_endpoint:
          type: string
          maxLength: 255
        storage_region:
          type: string
          maxLength: 64
        storage_bucket:
          type: string
          maxLength: 63
        storage_access_key:
          type: string
          maxLength: 255
        storage_secret_key:
          type: string
          writeOnly: true
          maxLength: 1024
        storage_path_style:
          type: boolean
        webhooks_allow_local:
          type: boolean
          description: Let webhooks reach plain HTTP and private or loopback addresses, for development.
    Workflow:
      description: A Moneybird workflow with MoneyHarpy extensions.
      allOf:
      - $ref: '#/components/schemas/workflow_response'
      - type: object
        required:
        - uri
        - invoice_email_subject
        - invoice_email_body
        properties:
          uri:
            type: string
            description: MoneyHarpy extension. Canonical path of this resource.
          invoice_email_subject:
            type: string
            description: >-
              MoneyHarpy extension. The subject invoices are emailed with; empty uses the default. Placeholders:
              {invoice_id}, {invoice_date}, {due_date}, {total}, {contact_name}, {company_name}, {payment_reference}, {reference}.
          invoice_email_body:
            type: string
            description: MoneyHarpy extension. The text invoices are emailed with; empty uses the default. Same placeholders.
    DocumentStyle:
      description: >-
        A Moneybird document style with MoneyHarpy extensions. Moneybird's API has no fields for the look of emails,
        public views and the online sales checkout or for the layout options below; MoneyHarpy names them after
        Moneybird's editor form.
      allOf:
      - $ref: '#/components/schemas/document_style_response'
      - type: object
        required: [uri, hide_sender_address, sender_address_width, show_epc_code, invoice_recipient_address, estimate_recipient_address,
          email_header_type, email_header_content_position, email_header_background_color, email_header_text, email_header_text_color,
          email_logo_display_width, email_footer_type, email_footer_text_color, email_footer_background_color, email_footer_profile_title,
          email_footer_profile_subtitle, body_background_color, email_font_family, email_moneybird_label_enabled, public_view_logo_display_size,
          public_view_background_color, public_view_moneybird_label_enabled, checkout_show_address, checkout_show_phone_field, checkout_for_business,
          checkout_show_identity, checkout_show_withdrawal_button, checkout_favorite_label, email_logo_hash, email_header_background_hash,
          email_footer_profile_picture_hash, email_footer_background_hash, public_view_logo_hash, images]
        properties:
          uri:
            type: string
            description: MoneyHarpy extension. Canonical path of this resource.
          hide_sender_address:
            type: boolean
            description: "MoneyHarpy extension. Leave the sender address off invoices and quotes, for a background image that has it."
          sender_address_width:
            type: integer
            minimum: 100
            maximum: 400
            description: "MoneyHarpy extension. Width of the sender address in pixels, 100 to 400."
          show_epc_code:
            type: boolean
            description: "MoneyHarpy extension. Print a QR code (EPC) customers can pay an invoice with from their banking app."
          invoice_recipient_address:
            type: array
            items:
              $ref: '#/components/schemas/DocumentStyleLine'
            description: "MoneyHarpy extension. Details under the customer address on invoices."
          estimate_recipient_address:
            type: array
            items:
              $ref: '#/components/schemas/DocumentStyleLine'
            description: "MoneyHarpy extension. Details under the customer address on quotes."
          email_header_type:
            type: string
            enum: ["", background_image_with_text, background_image_with_logo, background_image, background_color_with_logo, background_color_with_text]
            description: "MoneyHarpy extension. The header of emails; empty for none."
          email_header_content_position:
            type: string
            enum: [left, center, right]
            description: "MoneyHarpy extension."
          email_header_background_color:
            type: string
            pattern: '^#[0-9A-Fa-f]{6}$'
            description: "MoneyHarpy extension."
          email_header_text:
            type: string
            maxLength: 500
            description: "MoneyHarpy extension. The text of a header with text."
          email_header_text_color:
            type: string
            pattern: '^#[0-9A-Fa-f]{6}$'
            description: "MoneyHarpy extension."
          email_logo_display_width:
            type: integer
            minimum: 10
            maximum: 100
            description: "MoneyHarpy extension. Width of the email logo in percent, 10 to 100."
          email_footer_type:
            type: string
            enum: ["", contact_information, signature, background_image]
            description: "MoneyHarpy extension. The footer of emails; empty for none."
          email_footer_text_color:
            type: string
            pattern: '^#[0-9A-Fa-f]{6}$'
            description: "MoneyHarpy extension."
          email_footer_background_color:
            type: string
            pattern: '^#[0-9A-Fa-f]{6}$'
            description: "MoneyHarpy extension."
          email_footer_profile_title:
            type: string
            maxLength: 100
            description: "MoneyHarpy extension. The name in a signature footer."
          email_footer_profile_subtitle:
            type: string
            maxLength: 100
            description: "MoneyHarpy extension. The line under the name in a signature footer."
          body_background_color:
            type: string
            pattern: '^#[0-9A-Fa-f]{6}$'
            description: "MoneyHarpy extension. The colour around the email."
          email_font_family:
            type: string
            enum: [lucida_grande, helvetica, arial, verdana, georgia, times_new_roman, courier]
            description: "MoneyHarpy extension."
          email_moneybird_label_enabled:
            type: boolean
            description: "MoneyHarpy extension. Show \"Sent with MoneyHarpy\" under emails. Named as in Moneybird's document style form."
          public_view_logo_display_size:
            type: integer
            minimum: 10
            maximum: 100
            description: "MoneyHarpy extension. Size of the public view logo in percent, 10 to 100."
          public_view_background_color:
            type: string
            enum: ['#F7F9FC', '#F6E4E2', '#EDE8F7', '#D5E8FA', '#DEF4F8', '#FBE0D5', '#FCF1DB', '#D7ECEA', '#E7F3E6', '#E4E9EB']
            description: "MoneyHarpy extension. The page colour of public views."
          public_view_moneybird_label_enabled:
            type: boolean
            description: "MoneyHarpy extension. Show \"Made with MoneyHarpy\" on public views. Named as in Moneybird's document style form."
          checkout_show_address:
            type: boolean
            description: "MoneyHarpy extension. The online sales checkout asks for an address."
          checkout_show_phone_field:
            type: boolean
            description: "MoneyHarpy extension. The checkout asks for a phone number."
          checkout_for_business:
            type: boolean
            description: "MoneyHarpy extension. The checkout starts as a business purchase, with prices excluding VAT and a company name field."
          checkout_show_identity:
            type: boolean
            description: "MoneyHarpy extension. The checkout shows the company details."
          checkout_show_withdrawal_button:
            type: boolean
            description: "MoneyHarpy extension. The checkout lets consumers withdraw a purchase within 14 days of payment."
          checkout_favorite_label:
            type: string
            maxLength: 20
            description: "MoneyHarpy extension. The label on the subscription marked as favourite."
          email_logo_hash: &styleHash
            type: string
            nullable: true
            description: MoneyHarpy extension. The SHA-256 of the file, or null without one.
          email_header_background_hash: *styleHash
          email_footer_profile_picture_hash: *styleHash
          email_footer_background_hash: *styleHash
          public_view_logo_hash: *styleHash
          images:
            type: array
            description: MoneyHarpy extension. The images custom CSS can use, in upload order.
            items:
              type: object
              required: [id, content_type, url]
              properties:
                id:
                  type: string
                  description: The SHA-256 of the image.
                content_type:
                  type: string
                url:
                  type: string
                  description: Where the image is served, for url() in custom CSS.
    WorkflowRequest:
      type: object
      required:
      - workflow
      additionalProperties: false
      properties:
        workflow:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
              - InvoiceWorkflow
              - EstimateWorkflow
              description: Required when creating; ignored when updating.
            name:
              type: string
              maxLength: 255
            currency:
              type: string
              maxLength: 3
            language:
              $ref: '#/components/schemas/Language'
            active:
              type: boolean
            default:
              type: boolean
            prices_are_incl_tax:
              type: boolean
            show_qr_code:
              type: boolean
            invoice_email_subject:
              type: string
              maxLength: 255
              description: MoneyHarpy extension. Empty uses the default.
            invoice_email_body:
              type: string
              maxLength: 10000
              description: MoneyHarpy extension. Empty uses the default.
            steps_attributes:
              type: array
              maxItems: 11
              description: The payment term or validity first, then the reminders.
              items:
                type: object
                additionalProperties: false
                properties:
                  due_interval:
                    type: integer
                    minimum: 0
                    maximum: 365
                    description: Days until payment is due, or until an estimate expires. First step only.
                  reminder_delay:
                    type: integer
                    minimum: 0
                    maximum: 365
                    description: Days after the previous stage that this reminder is due.
                  reminder_text:
                    type: string
                    maxLength: 5000
                  reminder_auto_send:
                    type: boolean
    DeclarationPeriod:
      type: string
      enum: [month, quarter, year]
    AccountType:
      type: string
      enum: [non_current_assets, current_assets, equity, provisions, non_current_liabilities, current_liabilities, revenue, direct_costs, expenses, other_income_expenses]
    DocumentType:
      type: string
      enum: [sales_invoice, purchase_invoice, general_journal_document, financial_mutation, payment]
    TaxRateType:
      type: string
      enum: [sales_invoice, purchase_invoice, general_journal_document]
    ChartScheme:
      type: object
      description: MoneyHarpy extension. A standard chart of accounts categories can map to.
      required: [id, country, name, version, source]
      properties:
        id:
          type: string
          example: nl-rgs-3.8
        country:
          type: string
          example: NL
        name:
          type: string
        version:
          type: string
        source:
          type: string
          description: Where the scheme is published.
    TaxReportBox:
      type: object
      description: MoneyHarpy extension. One box of the country's VAT return.
      required: [code, name]
      properties:
        code:
          type: string
          example: NL/1a
        name:
          type: string
    BookkeepingSettings:
      type: object
      description: MoneyHarpy extension.
      required: [vat_documents_period, intra_community_transactions_declaration_period, chart_scheme, period_locked_until, chart_schemes, tax_report_boxes]
      properties:
        vat_documents_period:
          $ref: '#/components/schemas/DeclarationPeriod'
        intra_community_transactions_declaration_period:
          $ref: '#/components/schemas/DeclarationPeriod'
        chart_scheme:
          type: string
          description: ID of the chart scheme categories map to; empty for none.
        period_locked_until:
          type: string
          format: date
          nullable: true
          description: The books are closed up to and including this date.
        chart_schemes:
          type: array
          description: The chart schemes that can be chosen.
          items:
            $ref: '#/components/schemas/ChartScheme'
        tax_report_boxes:
          type: array
          description: The boxes of the administration's VAT return.
          items:
            $ref: '#/components/schemas/TaxReportBox'
    BookkeepingSettingsRequest:
      type: object
      required: [bookkeeping_settings]
      additionalProperties: false
      properties:
        bookkeeping_settings:
          type: object
          additionalProperties: false
          properties:
            vat_documents_period:
              $ref: '#/components/schemas/DeclarationPeriod'
            intra_community_transactions_declaration_period:
              $ref: '#/components/schemas/DeclarationPeriod'
            chart_scheme:
              type: string
              maxLength: 64
            period_locked_until:
              type: string
              maxLength: 10
              description: A date (YYYY-MM-DD) not in the future, or empty to unlock.
    TaxRate:
      description: A Moneybird tax rate with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/tax_rate_response'
        - type: object
          required: [uri, tax_report_boxes, position]
          properties:
            uri:
              type: string
              description: MoneyHarpy extension. Canonical path of this resource.
            tax_report_boxes:
              type: array
              description: MoneyHarpy extension. The boxes of the VAT return the rate counts in.
              items:
                type: string
            position:
              type: integer
              description: MoneyHarpy extension. Order among the rates of its type, from 1.
    TaxRateRequest:
      type: object
      required: [tax_rate]
      additionalProperties: false
      properties:
        tax_rate:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
            percentage:
              type: string
              maxLength: 6
              description: From 0 to 100 with at most two decimals; a comma is accepted.
            tax_rate_type:
              $ref: '#/components/schemas/TaxRateType'
            show_tax:
              type: boolean
              description: Print the VAT on the document. Off for reverse-charged and exempt rates.
            active:
              type: boolean
            country:
              type: string
              maxLength: 2
              description: ISO 3166-1 alpha-2 code for a rate of another country; empty for the administration's own.
            tax_report_boxes:
              type: array
              maxItems: 20
              items:
                type: string
                maxLength: 16
    TaxRateOrderRequest:
      type: object
      required: [tax_rate_type, ids]
      additionalProperties: false
      properties:
        tax_rate_type:
          $ref: '#/components/schemas/TaxRateType'
        ids:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Identifier'
    TimeEntry:
      description: A Moneybird time entry with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/time_entry_response'
        - type: object
          required: [id, administration_id, user_id, started_at, ended_at, description, paused_duration, billable, contact_id, project_id,
                     sales_invoice_id, contact, project, sales_invoice, user, notes, events, uri]
          properties:
            uri:
              type: string
              description: MoneyHarpy extension. Canonical path of this resource.
    TimeEntryRequest:
      type: object
      required: [time_entry]
      additionalProperties: false
      properties:
        time_entry:
          type: object
          additionalProperties: false
          properties:
            user_id:
              description: The member the time is for. Required on creation.
              $ref: '#/components/schemas/FlexibleIdentifier'
            started_at:
              type: string
              format: date-time
              description: Required on creation. Rounded down to whole minutes.
            ended_at:
              type: string
              format: date-time
              description: Rounded down to whole minutes. Leave it out for a running timer.
            description:
              type: string
              maxLength: 10000
              description: Required on creation.
            contact_id:
              nullable: true
              oneOf:
                - $ref: '#/components/schemas/FlexibleIdentifier'
            project_id:
              nullable: true
              oneOf:
                - $ref: '#/components/schemas/FlexibleIdentifier'
            sales_invoice_id:
              nullable: true
              oneOf:
                - $ref: '#/components/schemas/FlexibleIdentifier'
            billable:
              $ref: '#/components/schemas/FlexibleBoolean'
            paused_duration:
              description: Seconds, rounded down to whole minutes.
              oneOf:
                - type: integer
                  minimum: 0
                  maximum: 31536000
                - type: string
                  pattern: '^[0-9]{1,8}$'
    TaskList:
      description: A Moneybird task list with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/task_list_response'
        - type: object
          required: [id, administration_id, name, description, deadline_on, period_begin, period_end, completed, template_id, total_tasks_count,
                     completed_tasks_count, groups, uri]
          properties:
            uri:
              type: string
              description: MoneyHarpy extension. Canonical path of this resource.
    TaskListGroup:
      description: A Moneybird task list group.
