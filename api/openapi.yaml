        '200':
          $ref: '#/components/responses/PurchaseInvoicePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createPurchaseInvoice
      x-permissions: [documents]
      summary: Create a purchase invoice
      description: >-
        With a supplier and at least one line it is booked at once: the total on the creditors (accounts payable) for
        the supplier, each line excluding VAT on its category (expenses still to categorize when left out) and the VAT
        per rate on receivable VAT; reverse-charged VAT is booked on both receivable and payable VAT and is not part
        of the total, and fiscal allocations move their percentage of a category's amount, VAT included, to a private
        category. A revenue_invoice books the other way. Without, it is new and books nothing until filled in. Not in
        the locked period.
