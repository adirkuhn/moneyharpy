      - $ref: '#/components/parameters/id'
    get:
      operationId: getSubscription
      x-permissions: [sales_invoices]
      summary: Get subscription
      tags: [Subscriptions]
      responses:
        '200':
          description: The subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateSubscription
      x-permissions: [sales_invoices]
      summary: Update a subscription
      description: >-
        A new product, amount or discount starts on start_date, today unless given, and the subscription's products list
        both. When the change starts within a period already billed, the difference in price for the rest of that period
        is billed on a one-off sales invoice that goes with the next subscription invoice. A change after the next invoice
        date applies from the invoice that falls in it.
      tags: [Subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdateRequest'
      responses:
        '200':
          description: The updated subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: cancelSubscription
      x-permissions: [sales_invoices]
      summary: Cancel a subscription
      description: >-
        Cancels the subscription on end_date, today unless given: its recurring sales invoice makes no invoice on or after
        that date. A cancelled subscription cannot be cancelled or changed again (400).
      tags: [Subscriptions]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCancelRequest'
      responses:
        '200':
          description: The cancelled subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
