      - $ref: '#/components/parameters/administration_id'
    get:
      operationId: getJournalEntriesReport
      x-permissions: [documents, bank]
      summary: Get journal entries report
      description: >-
        Every booking in the period, oldest first, on a ledger account, for a contact or for a project; one of them is required. account_type needs a contact_id or project_id. Bank transactions post too: the whole amount on the account, each booking against its category, and the part not booked yet against unprocessed transactions.
        MoneyHarpy extension: document_type with document_id selects the bookings of one document, such as a sales invoice or a payment, which is subject enough; without a period they cover every date.
      tags: [Journal]
      parameters:
        - $ref: '#/components/parameters/report_period'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: ledger_account_id
          in: query
          schema:
            type: string
            pattern: '^[0-9]{1,19}$'
        - name: contact_id
          in: query
          description: A contact's id, or null for entries without a contact.
          schema:
            type: string
            pattern: '^([0-9]{1,19}|null)$'
