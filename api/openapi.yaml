openapi: 3.0.3
info:
  title: MoneyHarpy API
  version: 2.0.0
  license:
    name: MIT
    url: https://opensource.org/license/mit
  description: |
    REST/JSON API of MoneyHarpy, compatible with the Moneybird v2 API.

    **Paths.** Everything under `/api/v2` may be requested with or without a
    `.json` suffix. XML is not supported and answers `406`.

    **Identifiers.** IDs are large integers. Always treat them as strings.

    **Authentication.** Send a personal API token, created under *User account*,
    as `Authorization: Bearer <token>`.

    **Throttling.** `/api/v2` allows 150 requests per 5 minutes per IP address.
    Exceeding it answers `429` with `Retry-After`, `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset` headers.
servers:
  - url: /
tags:
  - name: Administrations
    description: Company accounts. Compatible with the Moneybird API.
  - name: Identities
    description: Company details and sender addresses. Compatible with the Moneybird API.
  - name: Invoices and estimates
    description: Numbering and document copies by email for invoices and estimates. MoneyHarpy extension.
  - name: Workflows
    description: How invoices and estimates are handled, such as payment terms and reminders. Compatible with the Moneybird API.
  - name: Document styles
    description: The look of invoices and estimates. Compatible with the Moneybird API.
  - name: Bookkeeping
    description: VAT declaration periods, chart scheme and locked period. MoneyHarpy extension.
  - name: Tax rates
    description: VAT rates and the VAT return boxes they count in. Compatible with the Moneybird API.
  - name: Ledger accounts
    description: Categories the books are kept in, mapped to a chart scheme such as RGS. Compatible with the Moneybird API.
  - name: Bank
    description: Automatic booking and other bank preferences. MoneyHarpy extension.
  - name: Financial accounts
    description: Bank, cash, credit card and payment service accounts, and importing statement files. Compatible with the Moneybird API.
  - name: Financial statements
    description: Groups of transactions as they came in. Compatible with the Moneybird API.
  - name: Financial mutations
    description: Transactions and booking them on categories. Compatible with the Moneybird API.
  - name: Overview
    description: An administration's home page. MoneyHarpy extension.
  - name: Contacts
    description: Customers and suppliers with their contact people and notes. Compatible with the Moneybird API.
  - name: Journal
    description: Journal entries made by hand and the reports that read the whole journal. Compatible with the Moneybird API.
  - name: Reports
    description: The financial reports and the exports that land in the downloads, worked out from the journal. Compatible with the Moneybird API.
  - name: Purchase invoices
    description: Invoices from suppliers, booked when saved and paid by hand or with bank transactions. Compatible with the Moneybird API.
  - name: Receipts
    description: Receipts of costs paid at once or later, booked when saved. Compatible with the Moneybird API.
  - name: General documents
    description: Documents kept for the record, such as contracts, that book nothing. Compatible with the Moneybird API.
  - name: Typeless documents
    description: Uploads still to be processed into a document. Compatible with the Moneybird API.
  - name: Purchase transactions
    description: Credit transfers that pay purchase invoices, batched and exported as SEPA files. Compatible with the Moneybird API.
  - name: Assets
    description: Fixed assets with their depreciation, disposal and reinvestment reserve, booked in the journal. Compatible with the Moneybird API.
  - name: Sales invoices
    description: Invoices to customers, from draft to sent, with their PDF, e-invoice, bookings and credit invoices. Compatible with the Moneybird API.
  - name: External sales invoices
    description: Invoices made in other software, such as a webshop or a till, booked and followed until paid. Compatible with the Moneybird API.
  - name: Recurring sales invoices
    description: Templates that make sales invoices on a schedule, and send them if wanted. Compatible with the Moneybird API.
  - name: Subscriptions
    description: Products billed to a contact every period through a recurring sales invoice, with additional charges. Compatible with the Moneybird API.
  - name: Subscription templates
    description: Subscriptions sold through Moneybird Payments' checkout, which MoneyHarpy does not have. Compatible with the Moneybird API.
  - name: Customer contact portal
    description: Temporary links to a contact's invoices and subscriptions. Compatible with the Moneybird API.
  - name: Verifications
    description: What the administration has verified about itself. Compatible with the Moneybird API.
  - name: Downloads
    description: The files exports made. Compatible with the Moneybird API.
  - name: Estimates
    description: Quotes that contacts accept or reject, and that are billed as sales invoices. Compatible with the Moneybird API.
  - name: Payments
    description: Payments of invoices, looked up by id. Compatible with the Moneybird API.
  - name: Products
    description: What is sold, with the price, VAT rate and category lines take from it. Compatible with the Moneybird API.
  - name: Projects
    description: Projects lines and journal entries can be booked on. Compatible with the Moneybird API.
  - name: Time entries
    description: Time members spend, with running timers, billed on sales invoices. Compatible with the Moneybird API.
  - name: Task lists
    description: Checklists for recurring work, their groups, tasks and templates. Compatible with the Moneybird API.
  - name: Files
    description: Temporary download links the download operations redirect to.
  - name: Booking rules
    description: Rules that book matching transactions automatically. MoneyHarpy extension.
  - name: Management
    description: Users, invitations, permissions, security and deleting an administration. Users is compatible with the Moneybird API; the rest is a MoneyHarpy extension.
  - name: Integrations
    description: API tokens and AI connections (MCP) for one administration, and who may create them. MoneyHarpy extension.
  - name: Webhooks
    description: Notifications sent to other systems when things change. Compatible with the Moneybird API.
  - name: Custom fields
    description: Extra fields on invoices, contacts, estimates and identities. Compatible with the Moneybird API.
  - name: Onboarding
    description: Adding an administration.
  - name: Resources
    description: Locate any entity by its ID.
  - name: Authentication
    description: Browser sign-in.
  - name: User
    description: The signed-in user's API tokens.
  - name: Instance
    description: Settings of this installation. Instance administrators only.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/v2/administrations:
    get:
      operationId: listAdministrations
      summary: List all administrations
      description: Lists all administrations the current user has access to.
      tags: [Administrations]
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: A list of administrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Administration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createAdministration
      summary: Create an administration
      description: MoneyHarpy extension. The current user becomes its owner.
      tags: [Administrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdministrationRequest'
      responses:
        '201':
          description: The created administration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Administration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/administrations/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getAdministration
      x-permissions: []
      summary: Get an administration
      description: MoneyHarpy extension.
      tags: [Administrations]
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The administration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Administration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
    patch:
      operationId: updateAdministration
      x-permissions: [settings]
      summary: Update an administration
      description: MoneyHarpy extension. Omitted fields stay unchanged.
      tags: [Administrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdministrationRequest'
      responses:
        '200':
          description: The updated administration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Administration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/administrations/{id}/favorite:
    parameters:
      - $ref: '#/components/parameters/id'
    put:
      operationId: favoriteAdministration
      x-permissions: []
      summary: Mark an administration as favorite
      description: MoneyHarpy extension.
      tags: [Administrations]
      responses:
        '204':
          description: Marked as favorite
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: unfavoriteAdministration
      x-permissions: []
      summary: Remove an administration from favorites
      description: MoneyHarpy extension.
      tags: [Administrations]
      responses:
        '204':
          description: Removed from favorites
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/{administration_id}/custom_fields:
    parameters:
      - $ref: '#/components/parameters/administration_id'
    get:
      operationId: listCustomFields
      x-permissions: [settings, sales_invoices, documents, estimates, bank]
      summary: Retrieve custom fields
      tags: [Custom fields]
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The custom fields, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomField'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createCustomField
      x-permissions: [settings]
      summary: Create a custom field
      description: MoneyHarpy extension. Moneybird manages custom fields in its web app only.
      tags: [Custom fields]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldRequest'
      responses:
        '201':
          description: The created custom field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomField'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/invoice_settings:
    parameters: &id001
    - &id002
      $ref: '#/components/parameters/administration_id'
    get:
      operationId: getInvoiceSettings
      x-permissions: [settings, sales_invoices, estimates]
      summary: Get invoice and estimate settings
      description: MoneyHarpy extension. Numbering, document copies by email and payment options.
      tags:
      - Invoices and estimates
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateInvoiceSettings
      x-permissions: [settings]
      summary: Update invoice and estimate settings
      description: MoneyHarpy extension. Omitted fields stay unchanged.
      tags:
      - Invoices and estimates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceSettingsRequest'
      responses:
        '200':
          description: The updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/workflows:
    parameters: *id001
    get:
      operationId: listWorkflows
      x-permissions: [settings, sales_invoices, documents, estimates, bank]
      summary: Retrieve workflows
      description: The administration has a default invoice and a default estimate workflow.
      tags:
      - Workflows
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createWorkflow
      x-permissions: [settings]
      summary: Create a workflow
      description: MoneyHarpy extension. Moneybird manages workflows in its web app only. Omitted fields take the default workflow's values.
      tags:
      - Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRequest'
      responses:
        '201':
          description: The created workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/workflows/{id}:
    parameters: &id003
    - *id002
    - &id004
      $ref: '#/components/parameters/id'
    get:
      operationId: getWorkflow
      x-permissions: [settings, sales_invoices, documents, estimates, bank]
      summary: Retrieve a workflow
      tags:
      - Workflows
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateWorkflow
      x-permissions: [settings]
      summary: Update a workflow
      description: MoneyHarpy extension. steps_attributes replaces all steps. The default workflow stays active.
      tags:
      - Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRequest'
      responses:
        '200':
          description: The updated workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteWorkflow
      x-permissions: [settings]
      summary: Delete a workflow
      description: MoneyHarpy extension. The default workflows cannot be deleted.
      tags:
      - Workflows
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/document_styles:
    parameters: *id001
    get:
      operationId: listDocumentStyles
      x-permissions: [settings, sales_invoices, estimates]
      summary: Retrieve document styles
      description: The default style comes first.
      tags:
      - Document styles
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The document styles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentStyle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createDocumentStyle
      x-permissions: [settings]
      summary: Create a document style
      description: MoneyHarpy extension. Omitted fields take the default values.
      tags:
      - Document styles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentStyleRequest'
      responses:
        '201':
          description: The created document style
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStyle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/document_styles/{id}:
    parameters: *id003
    get:
      operationId: getDocumentStyle
      x-permissions: [settings, sales_invoices, estimates]
      summary: Retrieve a document style
      description: MoneyHarpy extension.
      tags:
      - Document styles
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The document style
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStyle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateDocumentStyle
      x-permissions: [settings]
      summary: Update a document style
      description: MoneyHarpy extension. Omitted fields stay unchanged.
      tags:
      - Document styles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentStyleRequest'
      responses:
        '200':
          description: The updated document style
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStyle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteDocumentStyle
      x-permissions: [settings]
      summary: Delete a document style
      description: MoneyHarpy extension. The default style cannot be deleted.
      tags:
      - Document styles
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/document_styles/{id}/images:
    parameters:
    - *id002
    - *id004
    post:
      operationId: addDocumentStyleImage
      x-permissions: [settings]
      summary: Add an image for custom CSS
      description: >-
        MoneyHarpy extension. Send a PNG, JPEG or GIF of at most 2 MB as the request body; a style holds at most 20.
        Custom CSS refers to the image by the url in the style's images.
      tags:
      - Document styles
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The updated document style
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStyle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/document_styles/{id}/images/{image_id}:
    parameters:
    - *id002
    - *id004
    - name: image_id
      in: path
      required: true
      description: The image's id from the style's images.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    get:
      operationId: getDocumentStyleImage
      x-permissions: [settings, sales_invoices, estimates]
      summary: Download an image for custom CSS
      description: MoneyHarpy extension.
      tags:
      - Document styles
      responses:
        '200':
          description: The image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: removeDocumentStyleImage
      x-permissions: [settings]
      summary: Remove an image for custom CSS
      description: MoneyHarpy extension.
      tags:
      - Document styles
      responses:
        '200':
          description: The updated document style
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStyle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/document_styles/{id}/{file}:
    parameters:
    - *id002
    - *id004
    - name: file
      in: path
      required: true
      description: >-
