                  $ref: '#/components/schemas/CompanyMatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/onboarding/address_lookup:
    get:
      operationId: addressLookup
      summary: Find a Dutch address by zipcode and house number
      tags: [Onboarding]
      parameters:
        - name: zipcode
          in: query
          required: true
          schema:
            type: string
            maxLength: 16
        - name: house_number
          in: query
          required: true
          schema:
            type: string
            maxLength: 16
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressMatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/resources/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: locateResource
      summary: Locate a resource
      description: Returns the canonical URI of any resource the user can access. Backs `/r/{id}` permalinks.
      tags: [Resources]
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Where the resource lives
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLocation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/providers:
    get:
      operationId: authProviders
      summary: List available sign-in methods
      tags: [Authentication]
      security: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Enabled sign-in methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviders'
  /api/auth/register:
    post:
      operationId: register
      summary: Register a new user
      description: The first user to register becomes the instance administrator.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered and signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '202':
          description: The password is right; finish with a code at /api/auth/two_factor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/password_reset/request:
    post:
      operationId: requestPasswordReset
      summary: Ask for a password reset email
      description: Answers 204 whether or not the address has an account, so accounts cannot be discovered.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/password_reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with an emailed token
      description: Tokens work once and expire after an hour. All existing sessions end.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmation'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Sign out
      tags: [Authentication]
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/me:
    get:
      operationId: currentUser
      summary: Get the signed-in user
      tags: [Authentication]
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/google/start:
    get:
      operationId: googleStart
      summary: Start signing in with Google
      tags: [Authentication]
      security: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '302':
          description: Redirect to Google
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/google/callback:
    get:
      operationId: googleCallback
      summary: Finish signing in with Google
      tags: [Authentication]
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '302':
          description: Redirect into the application
          headers:
            Location:
              schema:
                type: string
  /api/auth/lm2/start:
    get:
      operationId: lm2Start
      summary: Start signing in with LM2
      tags: [Authentication]
      security: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '302':
          description: Redirect to the LM2 login page
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/lm2/callback/{state}:
    get:
      operationId: lm2Callback
      summary: Finish signing in with LM2
      description: The state is in the path because LM2 appends its own query string to the redirect address.
      tags: [Authentication]
      security: []
      parameters:
        - name: state
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          schema:
            type: string
        - name: refresh_token
          in: query
          description: Sent by LM2. MoneyHarpy ignores and never stores it.
          schema:
            type: string
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '302':
          description: Redirect into the application
          headers:
            Location:
              schema:
                type: string
  /api/user/tokens:
    get:
      operationId: listTokens
      summary: List personal API tokens
      tags: [User]
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The tokens, without their secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createToken
      summary: Create a personal API token
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: The token. Its secret is shown only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/user/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    delete:
      operationId: deleteToken
      summary: Revoke a personal API token
      tags: [User]
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/instance/settings/test_email:
    post:
      operationId: sendTestEmail
      summary: Send a test email to yourself using the saved mail settings
      tags: [Instance]
      responses:
        '204':
          description: Sent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: The mail server refused or could not be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/instance/settings/test_storage:
    post:
      operationId: testStorage
      summary: Check the saved file storage settings
      description: Creates the bucket when it does not exist, then writes and removes a small object.
      tags: [Instance]
      responses:
        '204':
          description: The storage works
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: The storage refused or could not be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/instance/settings:
    get:
      operationId: instanceSettings
      summary: Get instance settings
      tags: [Instance]
      responses:
        '200':
          description: The settings. Secrets are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateInstanceSettings
      summary: Update instance settings
      description: Omitted fields stay unchanged. An empty secret keeps the stored one.
      tags: [Instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstanceSettingsRequest'
      responses:
        '200':
          description: The updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: moneyharpy_session
  headers:
    SessionCookie:
      description: The session cookie.
      schema:
        type: string
  parameters:
    administration_id:
      name: administration_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
  responses:
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until a new request can be made
          schema:
            type: integer
        RateLimit-Limit:
          description: The rate limit ceiling
          schema:
            type: integer
        RateLimit-Remaining:
          description: Requests left in the window
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the window resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: string
            example: Retry later
  schemas:
    Identifier:
      type: string
      pattern: '^[0-9]{1,19}$'
      description: A unique record identifier. Parse as a string.
      example: '123456789012345678'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        symbolic:
          type: object
          additionalProperties: true
    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          description: Messages per invalid attribute.
          additionalProperties:
            type: array
            items:
              type: string
    Administration:
      type: object
      required: [id, name, language, currency, country, time_zone, access, suspended, period_locked_until, period_start_date, favorite, uri, small_business_scheme, company_activities_description, company_website_url, company_website_absent, user_type, permissions, require_two_factor, support_access_until]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          example: Harpy B.V.
        language:
          $ref: '#/components/schemas/Language'
        currency:
          type: string
          description: The ISO 4217 currency code
          example: EUR
        country:
          type: string
          description: The ISO 3166-1 alpha-2 country code
          example: NL
        time_zone:
          type: string
          example: Europe/Amsterdam
        access:
          type: string
          enum: [accountant_company, user, support]
          description: The type of access the user has to this administration. support is a MoneyHarpy extension.
        suspended:
          type: boolean
        period_locked_until:
          type: string
          format: date
          nullable: true
          x-go-type: string
        period_start_date:
          type: string
          format: date
          x-go-type: string
          example: '2026-01-01'
        favorite:
          type: boolean
          description: MoneyHarpy extension.
        uri:
          type: string
          description: MoneyHarpy extension. Canonical path of this resource.
          example: /123456789012345678
        small_business_scheme:
          type: boolean
          description: MoneyHarpy extension. Registered for the Dutch small business scheme (KOR).
        company_activities_description:
          type: string
          description: MoneyHarpy extension. What the company does.
        company_website_url:
          type: string
          description: MoneyHarpy extension. Empty when unknown.
          example: https://example.com
        company_website_absent:
          type: boolean
          description: MoneyHarpy extension. The company confirmed it has no website.
        user_type:
          type: string
          enum: [owner, employee, accountant, support]
          description: MoneyHarpy extension. Your role; support is an instance admin let in through support access.
        permissions:
          type: array
          description: MoneyHarpy extension. What you may do here.
          items:
            $ref: '#/components/schemas/Permission'
        require_two_factor:
          type: boolean
          description: MoneyHarpy extension. Every user needs two-step verification.
        support_access_until:
          type: string
          format: date-time
          nullable: true
          description: MoneyHarpy extension. The instance admins may help until then.
    CustomField:
      type: object
      required: [id, administration_id, name, source, uri]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        administration_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          example: Slogan
        source:
          $ref: '#/components/schemas/CustomFieldSource'
        uri:
          type: string
          description: MoneyHarpy extension. Canonical path of this resource.
    CustomFieldSource:
      type: string
      enum: [sales_invoice, contact, identity, estimate]
      description: The kind of record the field belongs to.
    CustomFieldRequest:
      type: object
      required: [custom_field]
      additionalProperties: false
      properties:
        custom_field:
          type: object
          required: [name, source]
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
            source:
              $ref: '#/components/schemas/CustomFieldSource'
    CustomFieldValue:
      type: object
      required: [id, name, value]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        value:
          type: string
    Identity:
      type: object
      required: [id, administration_id, company_name, country, city, zipcode, address1, address2, email, phone, bank_account_name, bank_account_number, bank_account_bic, chamber_of_commerce, tax_number, custom_fields, created_at, updated_at, legal_entity_type, tax_number_absence_reason, default, uri]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        administration_id:
          $ref: '#/components/schemas/Identifier'
        company_name:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        zipcode:
          type: string
          nullable: true
        address1:
          type: string
          nullable: true
        address2:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        bank_account_name:
          type: string
          nullable: true
        bank_account_number:
          type: string
          nullable: true
        bank_account_bic:
          type: string
          nullable: true
        chamber_of_commerce:
          type: string
          nullable: true
        tax_number:
          type: string
          nullable: true
        custom_fields:
          type: array
          description: The identity's non-empty custom field values.
          items:
            $ref: '#/components/schemas/CustomFieldValue'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        legal_entity_type:
          type: string
          nullable: true
          description: MoneyHarpy extension.
        tax_number_absence_reason:
          allOf:
            - $ref: '#/components/schemas/TaxNumberAbsenceReason'
          nullable: true
          description: MoneyHarpy extension. Why the company has no VAT number; null when it has one or gave no reason.
        default:
          type: boolean
          description: MoneyHarpy extension. Whether this identity holds the company details.
        uri:
          type: string
          description: MoneyHarpy extension. Canonical path of this resource.
    IdentityRequest:
      type: object
      required: [identity]
      additionalProperties: false
      properties:
        identity:
          type: object
          additionalProperties: false
          properties:
            company_name:
              type: string
              maxLength: 255
            country:
              type: string
              maxLength: 255
            city:
              type: string
              maxLength: 255
            zipcode:
              type: string
              maxLength: 255
            address1:
              type: string
              maxLength: 255
            address2:
              type: string
              maxLength: 255
            email:
              type: string
              maxLength: 255
            phone:
              type: string
              maxLength: 255
            bank_account_name:
              type: string
              maxLength: 255
            bank_account_number:
              type: string
              maxLength: 255
            bank_account_bic:
              type: string
              maxLength: 255
            chamber_of_commerce:
              type: string
              maxLength: 255
            tax_number:
              type: string
              maxLength: 255
            legal_entity_type:
              type: string
              maxLength: 255
            tax_number_absence_reason:
              type: string
              enum: ['', below_tax_threshold, industry_exemption]
              description: MoneyHarpy extension. Empty clears it. Ignored while a VAT number is set.
            custom_fields_attributes:
              type: array
              description: Custom field values to set. An empty value removes it.
              maxItems: 100
              items:
                type: object
                required: [id, value]
                additionalProperties: false
                properties:
                  id:
                    $ref: '#/components/schemas/Identifier'
                  value:
                    type: string
                    maxLength: 255
    TaxNumberAbsenceReason:
      type: string
      enum: [below_tax_threshold, industry_exemption]
    UpdateAdministrationRequest:
      type: object
      required: [administration]
      additionalProperties: false
      properties:
        administration:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
            country:
              type: string
              maxLength: 2
              description: ISO 3166-1 alpha-2. The VAT return follows the new country; VAT rates and categories stay.
            language:
              $ref: '#/components/schemas/Language'
            currency:
              type: string
            time_zone:
              type: string
            small_business_scheme:
              type: boolean
              description: MoneyHarpy extension.
            company_activities_description:
              type: string
              maxLength: 1000
              description: MoneyHarpy extension.
            company_website_url:
              type: string
              maxLength: 255
              description: MoneyHarpy extension. An http or https address, or empty.
            company_website_absent:
              type: boolean
              description: MoneyHarpy extension. Ignored while a website is set.
    OnboardingOptions:
      type: object
      required: [countries, currencies, popular_currencies, company_search_countries, address_lookup_countries]
      properties:
        countries:
          type: array
          description: ISO 3166-1 alpha-2 codes.
          items:
            type: string
        currencies:
          type: array
          description: ISO 4217 codes.
          items:
            type: string
        popular_currencies:
          type: array
          items:
            type: string
        company_search_countries:
          type: array
          description: Countries whose company register can be searched here.
          items:
            type: string
        address_lookup_countries:
          type: array
          description: Countries whose addresses can be looked up here.
          items:
            type: string
    CompanyMatch:
      type: object
      required: [name, chamber_of_commerce, address1, zipcode, city]
      properties:
        name:
          type: string
        chamber_of_commerce:
          type: string
        address1:
          type: string
        zipcode:
          type: string
        city:
          type: string
    AddressMatch:
      type: object
      required: [address1, zipcode, city]
      properties:
        address1:
          type: string
        zipcode:
          type: string
        city:
          type: string
    Language:
      type: string
      enum: [nl, nl-be, en]
      description: The language code used in the administration
    CreateAdministrationRequest:
      type: object
      required: [administration]
      additionalProperties: false
      properties:
        administration:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
            language:
              $ref: '#/components/schemas/Language'
            currency:
              type: string
            country:
              type: string
            time_zone:
              type: string
            address1:
              type: string
              maxLength: 255
            address2:
              type: string
              maxLength: 255
            zipcode:
              type: string
              maxLength: 32
            city:
              type: string
              maxLength: 255
            chamber_of_commerce:
              type: string
              maxLength: 64
    ResourceLocation:
      type: object
      required: [id, type, uri]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
