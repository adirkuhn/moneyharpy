    patch:
      operationId: linkFinancialMutationBooking
      x-permissions: [bank]
      summary: Link a booking to a financial mutation
      description: >-
        Books on a category (LedgerAccount), pays a sales invoice (SalesInvoice, ExternalSalesInvoice) or a purchase
        invoice or receipt (Document), whose payment the bank posts on the creditors, makes and pays a new purchase
        invoice or receipt (NewPurchaseInvoice, NewReceipt; price_base signed like the document, the contact found by
        the transaction's IBAN) or pays what a purchase transaction or batch pays (PurchaseTransaction,
        PurchaseTransactionBatch). project_id puts a category booking or the new document's line on a project.
        Payment, PaymentTransaction, PaymentTransactionBatch and VatDocument answer 422 until they exist. price_base is the amount; positive books in the direction of the
        transaction, negative against it. Without it, the open amount is booked, and for an invoice at most
        what it has unpaid. A payment registered by hand that waits for its transaction is taken over by it.
        Split a transaction with one request per part. Not in the locked period.
