        granularity, periods also gives the balances at the end of every month, quarter or year in the period, the first and
        the last cut off at the period's start and end. An account with a zero balance at every end is left out. The period
        holds at most 12 months.
      tags: [Financial mutations]
      parameters:
        - $ref: '#/components/parameters/report_period'
