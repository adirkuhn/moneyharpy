openapi: 3.0.3
info:
  title: MoneyHarpy API
  version: 2.0.0
  license:
    name: MIT
    url: https://opensource.org/license/mit
  description: |
    REST/JSON API of MoneyHarpy, compatible with the Moneybird v2 API.

    **Paths.** Everything under `/api/v2` may be requested with or without a
    `.json` suffix. XML is not supported and answers `406`.

    **Identifiers.** IDs are large integers. Always treat them as strings.

    **Authentication.** Send a personal API token, created under *User account*,
    as `Authorization: Bearer <token>`.

    **Throttling.** `/api/v2` allows 150 requests per 5 minutes per IP address.
    Exceeding it answers `429` with `Retry-After`, `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset` headers.
servers:
  - url: /
tags:
  - name: Administrations
    description: Company accounts. Compatible with the Moneybird API.
  - name: Resources
    description: Locate any entity by its ID.
  - name: Authentication
    description: Browser sign-in.
  - name: User
    description: The signed-in user's API tokens.
  - name: Instance
    description: Settings of this installation. Instance administrators only.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/v2/administrations:
    get:
      operationId: listAdministrations
      summary: List all administrations
      description: Lists all administrations the current user has access to.
      tags: [Administrations]
      responses:
        '200':
          description: A list of administrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Administration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createAdministration
      summary: Create an administration
      description: MoneyHarpy extension. The current user becomes its owner.
      tags: [Administrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdministrationRequest'
      responses:
        '201':
          description: The created administration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Administration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/administrations/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getAdministration
      summary: Get an administration
      description: MoneyHarpy extension.
      tags: [Administrations]
      responses:
        '200':
          description: The administration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Administration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v2/administrations/{id}/favorite:
    parameters:
      - $ref: '#/components/parameters/id'
    put:
      operationId: favoriteAdministration
      summary: Mark an administration as favorite
      description: MoneyHarpy extension.
      tags: [Administrations]
      responses:
        '204':
          description: Marked as favorite
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: unfavoriteAdministration
      summary: Remove an administration from favorites
      description: MoneyHarpy extension.
      tags: [Administrations]
      responses:
        '204':
          description: Removed from favorites
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/resources/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: locateResource
      summary: Locate a resource
      description: Returns the canonical URI of any resource the user can access. Backs `/r/{id}` permalinks.
      tags: [Resources]
      responses:
        '200':
          description: Where the resource lives
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLocation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/providers:
    get:
      operationId: authProviders
      summary: List available sign-in methods
      tags: [Authentication]
      security: []
      responses:
        '200':
          description: Enabled sign-in methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviders'
  /api/auth/register:
    post:
      operationId: register
      summary: Register a new user
      description: The first user to register becomes the instance administrator.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered and signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Sign out
      tags: [Authentication]
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/me:
    get:
      operationId: currentUser
      summary: Get the signed-in user
      tags: [Authentication]
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/google/start:
    get:
      operationId: googleStart
      summary: Start signing in with Google
      tags: [Authentication]
      security: []
      responses:
        '302':
          description: Redirect to Google
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/google/callback:
    get:
      operationId: googleCallback
      summary: Finish signing in with Google
      tags: [Authentication]
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect into the application
          headers:
            Location:
              schema:
                type: string
  /api/auth/lm2/start:
    get:
      operationId: lm2Start
      summary: Start signing in with LM2
      tags: [Authentication]
      security: []
      responses:
        '302':
          description: Redirect to the LM2 login page
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/lm2/callback/{state}:
    get:
      operationId: lm2Callback
      summary: Finish signing in with LM2
      description: The state is in the path because LM2 appends its own query string to the redirect address.
      tags: [Authentication]
      security: []
      parameters:
        - name: state
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          schema:
            type: string
        - name: refresh_token
          in: query
          description: Sent by LM2. MoneyHarpy ignores and never stores it.
          schema:
            type: string
      responses:
        '302':
          description: Redirect into the application
          headers:
            Location:
              schema:
                type: string
  /api/user/tokens:
    get:
      operationId: listTokens
      summary: List personal API tokens
      tags: [User]
      responses:
        '200':
          description: The tokens, without their secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createToken
      summary: Create a personal API token
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: The token. Its secret is shown only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/user/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    delete:
      operationId: deleteToken
      summary: Revoke a personal API token
      tags: [User]
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/instance/settings:
    get:
      operationId: instanceSettings
      summary: Get instance settings
      tags: [Instance]
      responses:
        '200':
          description: The settings. Secrets are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateInstanceSettings
      summary: Update instance settings
      description: Omitted fields stay unchanged. An empty secret keeps the stored one.
      tags: [Instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstanceSettingsRequest'
      responses:
        '200':
          description: The updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: moneyharpy_session
  headers:
    SessionCookie:
      description: The session cookie.
      schema:
        type: string
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
  responses:
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until a new request can be made
          schema:
            type: integer
        RateLimit-Limit:
          description: The rate limit ceiling
          schema:
            type: integer
        RateLimit-Remaining:
          description: Requests left in the window
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the window resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: string
            example: Retry later
  schemas:
    Identifier:
      type: string
      pattern: '^[0-9]{1,19}$'
      description: A unique record identifier. Parse as a string.
      example: '416072101932303822'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        symbolic:
          type: object
          additionalProperties: true
    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          description: Messages per invalid attribute.
          additionalProperties:
            type: array
            items:
              type: string
    Administration:
      type: object
      required: [id, name, language, currency, country, time_zone, access, suspended, period_locked_until, period_start_date, favorite, uri]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          example: Harpy B.V.
        language:
          $ref: '#/components/schemas/Language'
        currency:
          type: string
          description: The ISO 4217 currency code
          example: EUR
        country:
          type: string
          description: The ISO 3166-1 alpha-2 country code
          example: NL
        time_zone:
          type: string
          example: Europe/Amsterdam
        access:
          type: string
          enum: [accountant_company, user]
          description: The type of access the user has to this administration
        suspended:
          type: boolean
        period_locked_until:
          type: string
          format: date
          nullable: true
          x-go-type: string
        period_start_date:
          type: string
          format: date
          x-go-type: string
          example: '2026-01-01'
        favorite:
          type: boolean
          description: MoneyHarpy extension.
        uri:
          type: string
          description: MoneyHarpy extension. Canonical path of this resource.
          example: /416072101932303822
    Language:
      type: string
      enum: [nl, nl-be, en]
      description: The language code used in the administration
    CreateAdministrationRequest:
      type: object
      required: [administration]
      additionalProperties: false
      properties:
        administration:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
            language:
              $ref: '#/components/schemas/Language'
            currency:
              type: string
            country:
              type: string
            time_zone:
              type: string
    ResourceLocation:
      type: object
      required: [id, type, uri]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        type:
          type: string
          example: administrations
        uri:
          type: string
          example: /416072101932303822
    AuthProviders:
      type: object
      required: [registration_open, google, lm2]
      properties:
        registration_open:
          type: boolean
        google:
          type: boolean
        lm2:
          type: boolean
    RegisterRequest:
      type: object
      required: [email, name, password]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 320
        name:
          type: string
          maxLength: 255
        password:
          type: string
          maxLength: 1024
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 320
        password:
          type: string
          maxLength: 1024
    CurrentUser:
      type: object
      required: [id, email, name, instance_admin]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        email:
          type: string
        name:
          type: string
        instance_admin:
          type: boolean
    ApiToken:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        created_at:
          type: string
          format: date-time
    CreatedApiToken:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The secret. Shown only once.
    CreateTokenRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
    InstanceSettings:
      type: object
      required: [registration_open, google_enabled, google_client_id, google_client_secret_set, lm2_enabled, lm2_url, lm2_app]
      properties:
        registration_open:
          type: boolean
        google_enabled:
          type: boolean
        google_client_id:
          type: string
        google_client_secret_set:
          type: boolean
        lm2_enabled:
          type: boolean
        lm2_url:
          type: string
        lm2_app:
          type: string
    UpdateInstanceSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        registration_open:
          type: boolean
        google_enabled:
          type: boolean
        google_client_id:
          type: string
        google_client_secret:
          type: string
          writeOnly: true
        lm2_enabled:
          type: boolean
        lm2_url:
          type: string
          description: Public address of the LM2 installation.
        lm2_app:
          type: string
          description: The name this installation is registered under in LM2.
