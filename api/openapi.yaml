          maxLength: 255
        storage_secret_key:
          type: string
          writeOnly: true
          maxLength: 1024
        storage_path_style:
          type: boolean
        webhooks_allow_local:
          type: boolean
          description: Let webhooks reach plain HTTP and private or loopback addresses, for development.
    Workflow:
      description: A Moneybird workflow with MoneyHarpy extensions.
      allOf:
      - $ref: '#/components/schemas/workflow_response'
      - type: object
        required:
        - uri
        properties:
          uri:
            type: string
            description: MoneyHarpy extension. Canonical path of this resource.
    DocumentStyle:
      description: A Moneybird document style with MoneyHarpy extensions.
      allOf:
      - $ref: '#/components/schemas/document_style_response'
      - type: object
        required:
        - uri
        properties:
          uri:
            type: string
            description: MoneyHarpy extension. Canonical path of this resource.
    WorkflowRequest:
      type: object
      required:
      - workflow
      additionalProperties: false
      properties:
        workflow:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
              - InvoiceWorkflow
              - EstimateWorkflow
              description: Required when creating; ignored when updating.
            name:
              type: string
              maxLength: 255
            currency:
              type: string
              maxLength: 3
            language:
              $ref: '#/components/schemas/Language'
            active:
              type: boolean
            default:
              type: boolean
            prices_are_incl_tax:
              type: boolean
            show_qr_code:
              type: boolean
            steps_attributes:
              type: array
              maxItems: 11
              description: The payment term or validity first, then the reminders.
              items:
                type: object
                additionalProperties: false
                properties:
                  due_interval:
                    type: integer
                    minimum: 0
                    maximum: 365
                    description: Days until payment is due, or until an estimate expires. First step only.
                  reminder_delay:
                    type: integer
                    minimum: 0
                    maximum: 365
                    description: Days after the previous stage that this reminder is due.
                  reminder_text:
                    type: string
                    maxLength: 5000
                  reminder_auto_send:
                    type: boolean
    DeclarationPeriod:
      type: string
      enum: [month, quarter, year]
    AccountType:
      type: string
      enum: [non_current_assets, current_assets, equity, provisions, non_current_liabilities, current_liabilities, revenue, direct_costs, expenses, other_income_expenses]
    DocumentType:
      type: string
      enum: [sales_invoice, purchase_invoice, general_journal_document, financial_mutation, payment]
    TaxRateType:
      type: string
      enum: [sales_invoice, purchase_invoice, general_journal_document]
    ChartScheme:
      type: object
      description: MoneyHarpy extension. A standard chart of accounts categories can map to.
      required: [id, country, name, version, source]
      properties:
        id:
          type: string
          example: nl-rgs-3.8
        country:
          type: string
          example: NL
        name:
          type: string
        version:
          type: string
        source:
          type: string
          description: Where the scheme is published.
    TaxReportBox:
      type: object
      description: MoneyHarpy extension. One box of the country's VAT return.
      required: [code, name]
      properties:
        code:
          type: string
          example: NL/1a
        name:
          type: string
    BookkeepingSettings:
      type: object
      description: MoneyHarpy extension.
      required: [vat_documents_period, intra_community_transactions_declaration_period, chart_scheme, period_locked_until, chart_schemes, tax_report_boxes]
      properties:
        vat_documents_period:
          $ref: '#/components/schemas/DeclarationPeriod'
        intra_community_transactions_declaration_period:
          $ref: '#/components/schemas/DeclarationPeriod'
        chart_scheme:
          type: string
          description: ID of the chart scheme categories map to; empty for none.
        period_locked_until:
          type: string
          format: date
          nullable: true
          description: The books are closed up to and including this date.
        chart_schemes:
          type: array
          description: The chart schemes that can be chosen.
          items:
            $ref: '#/components/schemas/ChartScheme'
        tax_report_boxes:
          type: array
          description: The boxes of the administration's VAT return.
          items:
            $ref: '#/components/schemas/TaxReportBox'
    BookkeepingSettingsRequest:
      type: object
      required: [bookkeeping_settings]
      additionalProperties: false
      properties:
        bookkeeping_settings:
          type: object
          additionalProperties: false
          properties:
            vat_documents_period:
              $ref: '#/components/schemas/DeclarationPeriod'
            intra_community_transactions_declaration_period:
              $ref: '#/components/schemas/DeclarationPeriod'
            chart_scheme:
              type: string
              maxLength: 64
            period_locked_until:
              type: string
              maxLength: 10
              description: A date (YYYY-MM-DD) not in the future, or empty to unlock.
    TaxRate:
      description: A Moneybird tax rate with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/tax_rate_response'
        - type: object
          required: [uri, tax_report_boxes, position]
          properties:
            uri:
              type: string
              description: MoneyHarpy extension. Canonical path of this resource.
            tax_report_boxes:
              type: array
              description: MoneyHarpy extension. The boxes of the VAT return the rate counts in.
              items:
                type: string
            position:
              type: integer
              description: MoneyHarpy extension. Order among the rates of its type, from 1.
    TaxRateRequest:
      type: object
      required: [tax_rate]
      additionalProperties: false
      properties:
        tax_rate:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
            percentage:
              type: string
              maxLength: 6
              description: From 0 to 100 with at most two decimals; a comma is accepted.
            tax_rate_type:
              $ref: '#/components/schemas/TaxRateType'
            show_tax:
              type: boolean
              description: Print the VAT on the document. Off for reverse-charged and exempt rates.
            active:
              type: boolean
            country:
              type: string
              maxLength: 2
              description: ISO 3166-1 alpha-2 code for a rate of another country; empty for the administration's own.
            tax_report_boxes:
              type: array
              maxItems: 20
              items:
                type: string
                maxLength: 16
    TaxRateOrderRequest:
      type: object
      required: [tax_rate_type, ids]
      additionalProperties: false
      properties:
        tax_rate_type:
          $ref: '#/components/schemas/TaxRateType'
        ids:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Identifier'
    TaxonomyItem:
      description: A code of a chart scheme with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/taxonomy_item_response'
        - type: object
          required: [level, side]
          properties:
            description:
              type: string
              nullable: true
            level:
              type: integer
              description: MoneyHarpy extension. Depth in the scheme, from 1.
            side:
              type: string
              enum: [balance_sheet, profit_and_loss]
              description: MoneyHarpy extension.
    LedgerAccount:
      description: A Moneybird ledger account with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/ledger_account_response'
        - type: object
          required: [uri, description, system_role, template]
          properties:
            uri:
              type: string
              description: MoneyHarpy extension. Canonical path of this resource.
            description:
              type: string
              nullable: true
              description: MoneyHarpy extension. What the category is for.
            system_role:
              type: string
              nullable: true
              description: MoneyHarpy extension. Set on categories the books rely on, which cannot be removed or change type.
            template:
              type: string
              nullable: true
              description: MoneyHarpy extension. Key of the template the category was added with.
    LedgerAccountRequest:
      type: object
      required: [ledger_account]
      additionalProperties: false
      properties:
        ledger_account:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
            account_type:
              $ref: '#/components/schemas/AccountType'
            account_id:
              type: string
              maxLength: 20
              description: The account number, such as 8000.
            parent_id:
              type: string
              pattern: '^[0-9]{0,19}$'
              nullable: true
              description: Empty for none.
            active:
              type: boolean
              description: MoneyHarpy extension.
            allowed_document_types:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/DocumentType'
            description:
              type: string
              maxLength: 1000
        rgs_code:
          type: string
          maxLength: 32
          description: Code in the administration's chart scheme. Required on create when it has one.
    LedgerAccountSchemeRequest:
      type: object
      required: [ledger_accounts]
      additionalProperties: false
      properties:
        ledger_accounts:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [id, rgs_code]
            additionalProperties: false
            properties:
              id:
                $ref: '#/components/schemas/Identifier'
              rgs_code:
                type: string
                maxLength: 32
    LedgerAccountTemplate:
      type: object
      description: MoneyHarpy extension. A group of ledger accounts for a common situation.
      required: [key, name, description, applied, ledger_accounts]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        applied:
          type: boolean
          description: The administration has all of the template's ledger accounts.
        ledger_accounts:
          type: array
          items:
            type: object
            required: [name, account_type, account_id]
            properties:
              name:
                type: string
              account_type:
                $ref: '#/components/schemas/AccountType'
              account_id:
                type: string
    Money:
      description: An amount of money, such as "10.95" or "-3,5". A number is accepted too.
      oneOf:
        - type: string
          pattern: '^[-+]?[0-9]*[,.]?[0-9]{0,2}$'
          maxLength: 16
        - type: number
          minimum: -1000000000
          maximum: 1000000000
    FinancialAccountType:
      type: string
      enum: [BankAccount, CashAccount, CreditCardAccount, PaymentServiceAccount, CustomAccount]
    BankSettings:
      type: object
      description: MoneyHarpy extension.
      required: [automatic_booking]
      properties:
        automatic_booking:
          type: boolean
          description: Book new transactions that match a booking rule.
    BankSettingsRequest:
      type: object
      required: [bank_settings]
      additionalProperties: false
      properties:
        bank_settings:
          type: object
          additionalProperties: false
          properties:
            automatic_booking:
              type: boolean
    FinancialAccount:
      description: A Moneybird financial account with MoneyHarpy extensions.
