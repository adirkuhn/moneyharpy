        estimate_bcc_email_address:
          type: string
        order_bcc_email_address:
          type: string
        default_email_ubl:
          type: boolean
          description: Attach a UBL file to invoices emailed to new contacts.
        payments_without_proof:
          type: boolean
          description: Allow marking invoices paid without a bank transaction.
