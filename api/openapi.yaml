    FinancialAccountRequest:
      type: object
      required: [financial_account]
      additionalProperties: false
      properties:
        financial_account:
          type: object
          additionalProperties: false
          properties:
            type:
              $ref: '#/components/schemas/FinancialAccountType'
            name:
              type: string
              maxLength: 255
            identifier:
              type: string
              maxLength: 64
              description: The account number, such as an IBAN, or a card's last digits.
            currency:
              type: string
              maxLength: 3
            active:
              type: boolean
    IdsRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Identifier'
    LedgerAccountBooking:
