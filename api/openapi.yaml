    delete:
      operationId: revokeConnection
      summary: Revoke a connection
      description: MoneyHarpy extension. Owners revoke any connection, others their own. Webhooks the connection made are deleted with it.
      tags: [Integrations]
      x-permissions: []
      responses:
        '204':
          description: Revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/webhooks:
    parameters:
      - $ref: '#/components/parameters/administration_id'
    get:
      operationId: listWebhooks
      summary: List all webhooks
      tags: [Webhooks]
      x-permissions: [settings]
      responses:
        '200':
          description: The webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createWebhook
      summary: Create a webhook
      description: >-
        The URL must answer a signed test delivery with 200 and use https, unless the instance allows local webhooks.
        enabled_events takes event names and groups; a group matches every event starting with it. Without events,
        Moneybird sends its legacy sales invoice events, which MoneyHarpy has none of yet. The secret, used for the
        Moneybird-Signature header, is returned only here.
      tags: [Webhooks]
      x-permissions: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
      responses:
        '201':
          description: The webhook with its secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/webhooks/events:
    parameters:
      - $ref: '#/components/parameters/administration_id'
    get:
      operationId: listWebhookEvents
      summary: The events webhooks can subscribe to
      description: MoneyHarpy extension.
      tags: [Webhooks]
      x-permissions: [settings]
      responses:
        '200':
          description: Events and groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEvents'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/webhooks/{id}:
    parameters:
      - $ref: '#/components/parameters/administration_id'
      - $ref: '#/components/parameters/id'
    get:
      operationId: getWebhook
      summary: Retrieve a webhook
      description: MoneyHarpy extension.
      tags: [Webhooks]
      x-permissions: [settings]
      responses:
        '200':
          description: The webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook
      tags: [Webhooks]
      x-permissions: [settings]
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/webhooks/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/administration_id'
      - $ref: '#/components/parameters/id'
    patch:
      operationId: activateWebhook
      summary: Activate a webhook
      tags: [Webhooks]
      x-permissions: [settings]
      responses:
        '200':
          description: The webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/{administration_id}/webhooks/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/administration_id'
      - $ref: '#/components/parameters/id'
    patch:
      operationId: deactivateWebhook
      summary: Deactivate a webhook
      tags: [Webhooks]
      x-permissions: [settings]
      responses:
        '200':
          description: The webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/mcp:
    post:
      operationId: mcp
      summary: Model Context Protocol endpoint
      description: >-
        MCP over streamable HTTP for AI connections, stateless: one JSON-RPC 2.0 message per request, answered with
        JSON. Sign in with an AI connection token as bearer. Supports initialize, ping, tools/list and tools/call; the
        tools are this API's operations the connection may use, run with its rights.
      tags: [Integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcMessage'
      responses:
        '200':
          description: The JSON-RPC answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '202':
          description: A notification was received
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/onboarding/options:
    get:
      operationId: onboardingOptions
      summary: List what can be chosen when adding an administration
      tags: [Onboarding]
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/onboarding/company_search:
    get:
      operationId: companySearch
      summary: Search a company register
      description: Only for countries listed in `company_search_countries`.
      tags: [Onboarding]
      parameters:
        - name: country
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 255
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Matching companies. Address parts the register does not return are empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyMatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/onboarding/address_lookup:
    get:
      operationId: addressLookup
      summary: Find a Dutch address by zipcode and house number
      tags: [Onboarding]
      parameters:
        - name: zipcode
          in: query
          required: true
          schema:
            type: string
            maxLength: 16
        - name: house_number
          in: query
          required: true
          schema:
            type: string
            maxLength: 16
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressMatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/resources/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: locateResource
      summary: Locate a resource
      description: Returns the canonical URI of any resource the user can access. Backs `/r/{id}` permalinks.
      tags: [Resources]
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Where the resource lives
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLocation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/providers:
    get:
      operationId: authProviders
      summary: List available sign-in methods
      tags: [Authentication]
      security: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Enabled sign-in methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviders'
  /api/files/{token}:
    get:
      operationId: downloadFile
      summary: Download a file by a temporary link
      description: >-
        Where the download operations redirect to, like Moneybird's storage links: the token names the file and who asked
        for it, is signed, and expires 30 seconds after it was made. No sign-in is needed.
      tags: [Files]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            maxLength: 2000
      responses:
        '200':
          description: The file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/register:
    post:
      operationId: register
      summary: Register a new user
      description: The first user to register becomes the instance administrator.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered and signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '202':
          description: The password is right; finish with a code at /api/auth/two_factor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorRequired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/password_reset/request:
    post:
      operationId: requestPasswordReset
      summary: Ask for a password reset email
      description: Answers 204 whether or not the address has an account, so accounts cannot be discovered.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/password_reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with an emailed token
      description: Tokens work once and expire after an hour. All existing sessions end.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmation'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Sign out
      tags: [Authentication]
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/me:
    get:
      operationId: currentUser
      summary: Get the signed-in user
      tags: [Authentication]
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/google/start:
    get:
      operationId: googleStart
      summary: Start signing in with Google
      tags: [Authentication]
      security: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '302':
          description: Redirect to Google
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/google/callback:
    get:
      operationId: googleCallback
      summary: Finish signing in with Google
      tags: [Authentication]
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '302':
          description: Redirect into the application
          headers:
            Location:
              schema:
                type: string
  /api/auth/lm2/start:
    get:
      operationId: lm2Start
      summary: Start signing in with LM2
      tags: [Authentication]
      security: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '302':
          description: Redirect to the LM2 login page
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/lm2/callback/{state}:
    get:
      operationId: lm2Callback
      summary: Finish signing in with LM2
      description: The state is in the path because LM2 appends its own query string to the redirect address.
      tags: [Authentication]
      security: []
      parameters:
        - name: state
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          schema:
            type: string
        - name: refresh_token
          in: query
          description: Sent by LM2. MoneyHarpy ignores and never stores it.
          schema:
            type: string
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '302':
          description: Redirect into the application
          headers:
            Location:
              schema:
                type: string
  /api/user/tokens:
    get:
      operationId: listTokens
      summary: List personal API tokens
      tags: [User]
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The tokens, without their secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createToken
      summary: Create a personal API token
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: The token. Its secret is shown only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/user/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    delete:
      operationId: deleteToken
      summary: Revoke a personal API token
      tags: [User]
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/instance/settings/test_email:
    post:
      operationId: sendTestEmail
      summary: Send a test email to yourself using the saved mail settings
      tags: [Instance]
      responses:
        '204':
          description: Sent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: The mail server refused or could not be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/instance/settings/test_storage:
    post:
      operationId: testStorage
      summary: Check the saved file storage settings
      description: Creates the bucket when it does not exist, then writes and removes a small object.
      tags: [Instance]
      responses:
        '204':
          description: The storage works
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: The storage refused or could not be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/instance/settings:
    get:
      operationId: instanceSettings
      summary: Get instance settings
      tags: [Instance]
      responses:
        '200':
          description: The settings. Secrets are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateInstanceSettings
      summary: Update instance settings
      description: Omitted fields stay unchanged. An empty secret keeps the stored one.
      tags: [Instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstanceSettingsRequest'
      responses:
        '200':
          description: The updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: moneyharpy_session
  headers:
    SessionCookie:
      description: The session cookie.
      schema:
        type: string
  parameters:
    media:
      name: media
      in: query
      description: stationery leaves out the sender's address and logo, for printing on paper that has them.
      schema:
        type: string
        maxLength: 100
    administration_id:
      name: administration_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    document_filter:
      name: filter
      in: query
      description: Comma-separated key:value terms.
      schema:
        type: string
        maxLength: 1000
    report_period:
      name: period
      in: query
      description: >-
        A month (202501), a range of whole months (202501..202503 or 20250101..20250331) or this_month, prev_month,
        next_month, this_quarter, prev_quarter, next_quarter, this_year, prev_year or next_year. This month unless given.
      schema:
        type: string
        maxLength: 20
    contact_id:
      name: contact_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    page:
      name: page
      in: query
      description: The page to return, starting at 1.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,8}$'
    per_page:
      name: per_page
      in: query
      description: Records per page, 50 unless given, at most 100.
      schema:
        type: string
        pattern: '^(100|[1-9][0-9]?)$'
    include_archived:
      name: include_archived
      in: query
      description: Include archived records.
      schema:
        type: string
        enum: ['true', 'false']
    contact_query:
      name: query
      in: query
      description: Free-text search across names, contact people, email, phone, customer id, tax and chamber of commerce numbers, IBAN and address.
      schema:
        type: string
        maxLength: 255
    contact_filter:
      name: filter
      in: query
      description: Comma-separated key:value terms; see Filter contacts.
      schema:
        type: string
        maxLength: 1000
  responses:
    ProductPage:
      description: A page of products
      headers:
        Link:
          description: RFC 8288 links to the first, prev, next and last pages.
          schema:
            type: string
        X-Total-Count:
          description: The number of products selected in all. MoneyHarpy extension.
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Product'
    ProjectPage:
      description: A page of projects
      headers:
        Link:
          description: RFC 8288 links to the first, prev, next and last pages.
          schema:
            type: string
        X-Total-Count:
          description: The number of projects selected in all. MoneyHarpy extension.
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Project'
    PaymentRequired:
      description: >-
        Moneybird answers this when the plan's limit is reached. MoneyHarpy has no plans or limits, so it does not answer
        this; it is declared for clients written against Moneybird.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: >-
        Moneybird answers this when finding duplicates takes too long. MoneyHarpy groups contacts in one pass and does not
        answer this; it is declared for clients written against Moneybird.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FileRedirect:
      description: >-
        Found. Location holds a link to the file that works for 30 seconds, without signing in, as Moneybird's storage
        links do.
      headers:
        Location:
          description: The temporary link to the file.
          schema:
            type: string
      content:
        text/plain:
          schema:
            type: string
