    get:
      operationId: listRecurringSalesInvoices
      x-permissions: [sales_invoices]
      summary: List all recurring sales invoices
      description: >-
        The next invoice to make first. Filter terms: state (active, inactive or, as an extension, all; active unless given), frequency (all, day, week, month, quarter, year), auto_send (true, false or null), contact_id, workflow_id and include_subscriptions (true also lists the recurring invoices of subscriptions; false unless given). Paged with a Link header and X-Total-Count.
      tags: [Recurring sales invoices]
      parameters:
        - $ref: '#/components/parameters/document_filter'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
