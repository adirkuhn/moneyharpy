      x-permissions: [sales_invoices]
      summary: Update a sales invoice
      description: >-
        As at Moneybird any invoice can change, sent and paid ones too, except one written off as uncollectible; a sent invoice is booked again and its state follows what is still unpaid (paid again, or open). Lines with an id change, lines with _destroy go, lines without an id are added. Not in the locked period. A change to a sent invoice is recorded as a sales_invoice_updated event with its changes.
