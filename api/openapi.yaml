      summary: Upload a SEPA credit transfer file
      description: >-
        Reads a SEPA credit transfer file (pain.001.001.09, or an older pain.001.001 version such as .03) and makes a
        purchase transaction batch per payment information block with a purchase transaction per transfer. Each batch
        is paid from financial_account_id, or from the financial account with the block's IBAN. A transfer whose
