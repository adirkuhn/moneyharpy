      operationId: createSalesInvoicePayment
      x-permissions: [sales_invoices]
      summary: Create a payment
      description: >-
        Registers a payment on a sent invoice, signed like the invoice (negative on a credit invoice) and at most what is unpaid. The manual_payment_action chooses the account it is booked against: bank_transfer and payment_without_proof on received payments to be classified until a bank transaction takes the payment over, cash_payment on cash (or the financial account given), private_payment on private deposits, rounding_error on rounding, balance_settlement on the balance sheet category in ledger_account_id, and invoices_settlement against the invoice in invoice_id on settlements. With financial_mutation_id the bank transaction pays the invoice instead and posts the payment. A payment that covers what is unpaid makes the invoice paid. Not in the locked period or the future.
