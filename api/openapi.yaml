    TaskListTaskRequest:
      type: object
      required: [task]
      additionalProperties: false
      properties:
        task:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
              description: Required on creation.
            description:
              type: string
              maxLength: 10000
            report_type:
              $ref: '#/components/schemas/TaskListReportType'
            assignee_id:
              $ref: '#/components/schemas/FlexibleIdentifier'
            related_entity_id:
              description: A category (ledger account) the task is about; null unlinks it.
              nullable: true
              oneOf:
                - $ref: '#/components/schemas/FlexibleIdentifier'
            generate_subtasks:
              description: Make a subtask per sub-category of the related category.
              $ref: '#/components/schemas/FlexibleBoolean'
    TaskListAssignmentRequest:
      type: object
      required: [assignee_id]
      additionalProperties: false
      properties:
        assignee_id:
          $ref: '#/components/schemas/FlexibleIdentifier'
    TaskListTemplateRequest:
      type: object
      required: [task_list_template]
      additionalProperties: false
      properties:
        task_list_template:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 255
              description: Required on creation.
            description:
              type: string
              maxLength: 10000
            period:
              type: string
              maxLength: 32
              description: An ISO 8601 duration (P1M, P3M, P1Y) or monthly, quarterly, yearly or none.
            deadline_after:
              type: string
              maxLength: 32
              description: An ISO 8601 duration after the period's end, such as P10D; empty for none.
    TaxonomyItem:
      description: A code of a chart scheme with MoneyHarpy extensions.
