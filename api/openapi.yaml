          example: '{year}-{id}'
        invoice_sequence_id:
          type: string
          description: The next sequence number. Leading zeros are kept.
          example: '0001'
        invoice_id_example:
          type: string
          description: The next invoice number if it were made today.
          example: 2026-0001
        estimate_id_template:
          type: string
        estimate_sequence_id:
          type: string
        estimate_id_example:
          type: string
