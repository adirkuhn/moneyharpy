  /api/v2/{administration_id}/documents/receipts:
    parameters:
      - $ref: '#/components/parameters/administration_id'
    get:
      operationId: listReceipts
      x-permissions: [documents]
      summary: List all receipts
      description: >-
        Filter terms: period (on the document date; this year unless a filter is given), state (all, new, open, late,
        paid, pending_payment; several separated by |), reference (several separated by |), contact_id,
        ledger_account_id, updated_after and attachment (all, with, without); recurring and automatic_saving are
        accepted, and as documents never recur and MoneyHarpy saves none by itself, recurring:enabled and
        automatic_saving:automatic select nothing. Newest first unless sort is date_asc. Paged with a Link header and
        X-Total-Count.
      tags: [Receipts]
      parameters:
        - $ref: '#/components/parameters/document_filter'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: sort
          in: query
          schema:
            type: string
            enum: [date_desc, date_asc]
        - name: new_filter
          in: query
          description: Moneybird's newer filter parameter, in the same key:value grammar. When given, it is used instead of filter.
          schema:
            type: string
            maxLength: 1000
      responses:
        '200':
          $ref: '#/components/responses/ReceiptPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createReceipt
      x-permissions: [documents]
      summary: Create a receipt
      description: >-
        With at least one line it is booked at once: the total on the creditors (accounts payable) for the supplier,
        each line excluding VAT on its category (expenses still to categorize when left out) and the VAT per rate on
        receivable VAT; reverse-charged VAT is booked on both receivable and payable VAT and is not part of the total,
        and fiscal allocations move their percentage of a category's amount, VAT included, to a private category. A
        supplier is optional. With payment.financial_account_id the receipt is paid at once from that financial
        account, as a cash payment dated the receipt date. Without, it is new and books nothing until filled in. Not
        in the locked period.
      tags: [Receipts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptRequest'
      responses:
        '201':
          description: The created receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
