    LedgerAccountTemplate:
      type: object
      description: >-
        MoneyHarpy extension. A theme of Moneybird's Add category: ledger accounts to pick from for a common
        situation, such as a company car, or one ledger account the user names (single).
      required: [key, name, description, intro, warning, name_label, choice, single, applied, ledger_accounts]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
          description: What the theme is for, in the list of themes.
        intro:
          type: string
          description: The text that heads the theme's page.
        warning:
          type: string
          description: A warning under the intro; empty for none.
        name_label:
          type: string
          description: >-
            Label of the name the ledger accounts' names are completed with, such as the entrepreneur's; their
            names hold {name} for it. Empty when the names are fixed.
        choice:
          nullable: true
          description: A question whose answer decides which ledger accounts show, such as how the car is financed.
          allOf:
            - $ref: '#/components/schemas/LedgerAccountTemplateChoice'
        single:
          nullable: true
          description: Set when the theme adds one ledger account the user names, instead of picking from ledger_accounts.
          allOf:
            - $ref: '#/components/schemas/LedgerAccountTemplateSingle'
        applied:
          type: boolean
          description: The administration has all of the template's ledger accounts. Never for single themes or names.
        ledger_accounts:
          type: array
          items:
            $ref: '#/components/schemas/LedgerAccountTemplateAccount'
    LedgerAccountTemplateAccount:
      type: object
      description: MoneyHarpy extension. A ledger account a theme can add.
      required: [key, parent, name, account_type, account_id, rgs_code, description, exists, selected, choices]
      properties:
        key:
          type: string
        parent:
          type: string
          nullable: true
          description: Key of the ledger account in the theme it goes under.
        name:
          type: string
        account_type:
          $ref: '#/components/schemas/AccountType'
        account_id:
          type: string
        rgs_code:
          type: string
          description: Code in the chart scheme; empty when the administration does not use the country's scheme.
        description:
          type: string
        exists:
          type: boolean
          description: The administration has this ledger account already.
        selected:
          type: boolean
          description: Ticked when the theme's page opens.
        choices:
          type: array
          description: The keys of the choice's options it shows for; empty for all.
          items:
            type: string
    LedgerAccountTemplateOption:
      type: object
      description: MoneyHarpy extension. An answer of a theme's choice, or a kind of ledger account a single theme adds.
      required: [key, name, rgs_code]
      properties:
        key:
          type: string
        name:
          type: string
        rgs_code:
          type: string
    LedgerAccountTemplateChoice:
      type: object
      description: MoneyHarpy extension.
      required: [label, prompt, options]
      properties:
        label:
          type: string
        prompt:
          type: string
          description: Shown until an option is chosen.
        options:
          type: array
          items:
            $ref: '#/components/schemas/LedgerAccountTemplateOption'
    LedgerAccountTemplateSingle:
      type: object
      description: MoneyHarpy extension. The one ledger account a single theme adds.
      required: [account_type, name_label, options_label, options_help, parent, options]
      properties:
        account_type:
          $ref: '#/components/schemas/AccountType'
        name_label:
          type: string
        options_label:
          type: string
          description: Empty when the options have no label of their own.
        options_help:
          type: string
        parent:
          type: boolean
          description: Whether a parent ledger account of the same type can be chosen.
        options:
          type: array
          items:
            $ref: '#/components/schemas/LedgerAccountTemplateOption'
    LedgerAccountTemplateRequest:
      type: object
      description: >-
        MoneyHarpy extension. What was filled in on a theme's page. Without ledger_accounts, all of the theme's
        ledger accounts the administration does not have are added.
      properties:
        ledger_accounts:
          type: array
          description: Keys of the ledger accounts to add; their parents in the theme come along.
          maxItems: 200
          items:
            type: string
            maxLength: 128
        name:
          type: string
          maxLength: 255
          description: Completes the names (name_label), or names the single ledger account.
        option:
          type: string
          maxLength: 64
          description: The kind of single ledger account.
        parent_id:
          type: string
          pattern: '^[0-9]{0,19}$'
          nullable: true
          description: The single ledger account's parent; empty for none.
    Money:
      description: An amount of money, such as "10.95" or "-3,5". A number is accepted too.
      oneOf:
        - type: string
          pattern: '^[-+]?[0-9]*[,.]?[0-9]{0,2}$'
          maxLength: 16
        - type: number
          minimum: -1000000000
          maximum: 1000000000
    FinancialAccountType:
      type: string
      enum: [BankAccount, CashAccount, CreditCardAccount, PaymentServiceAccount, CustomAccount]
    BankSettings:
      type: object
      description: MoneyHarpy extension.
      required: [automatic_booking]
      properties:
        automatic_booking:
          type: boolean
          description: Book new transactions that match a booking rule.
    BankSettingsRequest:
      type: object
      required: [bank_settings]
      additionalProperties: false
      properties:
        bank_settings:
          type: object
          additionalProperties: false
          properties:
            automatic_booking:
              type: boolean
    FinancialAccount:
      description: A Moneybird financial account with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/financial_account_response'
        - type: object
          required: [uri, position, ledger_account_id, last_import_at]
          properties:
            uri:
              type: string
              description: MoneyHarpy extension. Canonical path of this resource.
            position:
              type: integer
              description: MoneyHarpy extension. Order among the accounts, from 1.
            ledger_account_id:
              $ref: '#/components/schemas/Identifier'
            last_import_at:
              type: string
              format: date-time
              nullable: true
              description: MoneyHarpy extension. When transactions last came in.
    FinancialAccountRequest:
      type: object
      required: [financial_account]
      additionalProperties: false
      properties:
        financial_account:
          type: object
          additionalProperties: false
          properties:
            type:
              $ref: '#/components/schemas/FinancialAccountType'
            name:
              type: string
              maxLength: 255
            identifier:
              type: string
              maxLength: 64
              description: The account number, such as an IBAN, or a card's last digits.
            currency:
              type: string
              maxLength: 3
            active:
              type: boolean
    IdsRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Identifier'
    LedgerAccountBooking:
      description: A booking of (part of) a transaction on a category.
      allOf:
        - $ref: '#/components/schemas/ledger_account_booking_response'
        - type: object
          required: [booking_rule_id]
          properties:
            booking_rule_id:
              allOf:
                - $ref: '#/components/schemas/Identifier'
              nullable: true
              description: MoneyHarpy extension. The rule that made the booking.
    FinancialMutation:
      description: A Moneybird financial mutation with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/financial_mutation_response'
        - type: object
          required: [uri, ledger_account_bookings, valutation_date]
          properties:
            uri:
              type: string
              description: MoneyHarpy extension. Canonical path of this resource.
            valutation_date:
              type: string
              format: date
              nullable: true
              description: MoneyHarpy extension. When the money was credited or debited.
            ledger_account_bookings:
              type: array
              items:
                $ref: '#/components/schemas/LedgerAccountBooking'
    FinancialStatement:
      description: A Moneybird financial statement with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/financial_statement_response'
        - type: object
          required: [uri, administration_id, financial_mutations]
          properties:
            uri:
              type: string
              description: MoneyHarpy extension. Canonical path of this resource.
            administration_id:
              $ref: '#/components/schemas/Identifier'
            financial_mutations:
              type: array
              items:
                $ref: '#/components/schemas/FinancialMutation'
    FinancialMutationInput:
      type: object
      additionalProperties: false
      properties:
        id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: integer
          description: An existing transaction to change or remove; omit to add one.
        _destroy:
          type: boolean
        date:
          type: string
          format: date
        valutation_date:
          type: string
          format: date
        message:
          type: string
          maxLength: 5000
        amount:
          $ref: '#/components/schemas/Money'
        code:
          type: string
          maxLength: 64
        contra_account_name:
          type: string
          maxLength: 255
        contra_account_number:
          type: string
          maxLength: 64
        batch_reference:
          type: string
          maxLength: 255
        offset:
          type: integer
        account_servicer_transaction_id:
          type: string
          maxLength: 255
    FinancialStatementRequest:
      type: object
      required: [financial_statement]
      additionalProperties: false
      properties:
        financial_statement:
          type: object
          additionalProperties: false
          properties:
            financial_account_id:
              oneOf:
                - $ref: '#/components/schemas/Identifier'
                - type: integer
            reference:
              type: string
              maxLength: 255
            official_date:
              type: string
              format: date
            official_balance:
              $ref: '#/components/schemas/Money'
            importer_key:
              type: string
              maxLength: 255
            manual:
              type: boolean
              description: MoneyHarpy extension. The transactions were typed in by hand.
            financial_mutations_attributes:
              type: array
              maxItems: 10000
              items:
                $ref: '#/components/schemas/FinancialMutationInput'
    NextCustomerId:
      type: object
      required: [customer_id]
      properties:
        customer_id:
          type: string
          example: '43'
    NextDraftId:
      type: object
      required: [draft_id]
      properties:
        draft_id:
          type: integer
          example: 12
    SynchronizationItem:
      type: object
      required: [id, version]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        version:
          type: integer
    SynchronizationRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/Identifier'
              - type: integer
    LinkBookingRequest:
      type: object
      required: [booking_type]
      additionalProperties: false
      properties:
        booking_type:
          type: string
          enum: [SalesInvoice, Document, LedgerAccount, PaymentTransactionBatch, PurchaseTransaction, NewPurchaseInvoice, NewReceipt, PaymentTransaction, PurchaseTransactionBatch, ExternalSalesInvoice, Payment, VatDocument]
        booking_id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: integer
        price_base:
          $ref: '#/components/schemas/Money'
        price:
          $ref: '#/components/schemas/Money'
        description:
          type: string
          maxLength: 1000
        project_id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: integer
        payment_batch_identifier:
          type: string
        mark_open_sepa_transaction_as_paid:
          oneOf:
            - type: boolean
            - type: string
    UnlinkBookingRequest:
      type: object
      required: [booking_type, booking_id]
      additionalProperties: false
      properties:
        booking_type:
          type: string
          enum: [Payment, LedgerAccountBooking]
        booking_id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: integer
    ImportResult:
      type: object
      description: MoneyHarpy extension.
      required: [format, imported, duplicates, locked, auto_booked, financial_statements]
      properties:
        format:
          type: string
          enum: [camt, mt940]
        imported:
          type: integer
          description: New transactions.
        duplicates:
          type: integer
          description: Transactions the account had already.
        locked:
          type: integer
          description: Transactions skipped because they fall in the locked period.
        auto_booked:
          type: integer
          description: New transactions a booking rule booked.
        financial_statements:
          type: array
          items:
            $ref: '#/components/schemas/FinancialStatement'
    RuleCondition:
      type: object
      required: [field, operator, value]
      additionalProperties: false
      properties:
        field:
          type: string
          enum: [message, contra_account_name, contra_account_number, amount]
        operator:
          type: string
          enum: [contains, equals, starts_with, ends_with, greater_than, less_than]
          description: Text fields take contains, equals, starts_with or ends_with, ignoring case; amount takes equals, greater_than or less_than, without sign.
        value:
          type: string
          maxLength: 255
    Overview:
      type: object
      description: MoneyHarpy extension. An administration's home page.
      required: [recently_processed]
      properties:
        bank:
          $ref: '#/components/schemas/OverviewBank'
        sales:
          $ref: '#/components/schemas/OverviewSales'
        incoming:
          $ref: '#/components/schemas/OverviewIncoming'
        recently_processed:
          type: array
          description: The records processed last, newest first, at most 25.
          items:
            $ref: '#/components/schemas/OverviewItem'
    OverviewBank:
      type: object
      description: Present only with the bank permission.
      required: [balance, currency, unprocessed_count]
      properties:
        balance:
          type: string
          description: The sum of every financial account's balance.
          example: '1250.0'
        currency:
          type: string
          example: EUR
        unprocessed_count:
          type: integer
          minimum: 0
          description: Transactions of active accounts still to link.
    OverviewSales:
      type: object
      description: Present only with the sales invoices permission.
      required: [to_receive, to_remind, currency]
      properties:
        to_receive:
          $ref: '#/components/schemas/OverviewTally'
        to_remind:
          $ref: '#/components/schemas/OverviewTally'
        currency:
          type: string
          example: EUR
    OverviewTally:
      type: object
      description: Sent invoices still to be paid; to_remind holds those past their due date and not paused.
      required: [count, amount]
      properties:
        count:
          type: integer
          minimum: 0
        amount:
          type: string
          description: What they have unpaid.
          example: '1210.0'
    OverviewItem:
      type: object
      description: One recently processed record.
      required: [type, id, uri, title, description, amount, currency, date, state, processed_at]
      properties:
        type:
          type: string
          enum: [financial_mutation]
          description: What kind of record this is; more kinds join as MoneyHarpy grows.
        id:
          $ref: '#/components/schemas/Identifier'
        uri:
          type: string
        title:
          type: string
        description:
          type: string
        amount:
          type: string
          description: Positive for money in, negative for money out.
        currency:
          type: string
        date:
          type: string
          format: date
        state:
          type: string
        processed_at:
          type: string
          format: date-time
    BookingRule:
      type: object
      description: MoneyHarpy extension. Books matching transactions on a category.
      required: [id, administration_id, name, active, position, match_all, direction, financial_account_id, conditions, ledger_account_id, description, uri, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        administration_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        active:
          type: boolean
        position:
          type: integer
        match_all:
          type: boolean
          description: Every condition must match; otherwise one is enough.
        direction:
          type: string
          enum: [any, debit, credit]
        financial_account_id:
          allOf:
            - $ref: '#/components/schemas/Identifier'
          nullable: true
          description: Only transactions of this account; null for every account.
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleCondition'
        ledger_account_id:
          $ref: '#/components/schemas/Identifier'
        description:
          type: string
        uri:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FlexibleBoolean:
      description: A boolean; the strings "true" and "false" are accepted too, as at Moneybird.
      oneOf:
        - type: boolean
        - type: string
          enum: ['true', 'false']
    FlexibleIdentifier:
      description: An id as a string or a number; an empty string clears it.
      oneOf:
        - type: string
          pattern: '^[0-9]{0,19}$'
        - type: integer
          minimum: 0
    Contact:
      description: A Moneybird contact with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/contact_response'
        - type: object
          required: [id, administration_id, customer_id, country, archived, version, uri, contact_people, custom_fields, notes, events]
          properties:
            uri:
              type: string
              description: MoneyHarpy extension. Canonical path of this resource.
    ContactRequest:
      type: object
      required: [contact]
      additionalProperties: false
      properties:
        contact:
          type: object
          additionalProperties: false
          properties:
            company_name: {type: string, maxLength: 255}
            firstname: {type: string, maxLength: 255}
            lastname: {type: string, maxLength: 255}
            address1: {type: string, maxLength: 255}
            address2: {type: string, maxLength: 255}
            zipcode: {type: string, maxLength: 255}
            city: {type: string, maxLength: 255}
            country:
              type: string
              pattern: '^[A-Za-z]{2}$'
              description: ISO 3166-1 alpha-2; the administration's country unless given.
            phone: {type: string, maxLength: 255}
            delivery_method:
              type: string
              description: Email, Post, Manual, Simplerinvoicing or Peppol, in any case.
              pattern: '^(?i)(email|post|manual|simplerinvoicing|peppol)$'
            customer_id:
              type: string
              maxLength: 50
              description: Unique in the administration; the next number when left out.
            tax_number: {type: string, maxLength: 255}
            chamber_of_commerce: {type: string, maxLength: 255}
            bank_account: {type: string, maxLength: 255}
            send_invoices_to_attention: {type: string, maxLength: 255}
            send_invoices_to_email:
              type: string
              maxLength: 255
              description: One or more addresses separated by commas.
            send_estimates_to_attention: {type: string, maxLength: 255}
            send_estimates_to_email: {type: string, maxLength: 255}
            email_ubl:
              $ref: '#/components/schemas/FlexibleBoolean'
            direct_debit:
              $ref: '#/components/schemas/FlexibleBoolean'
            sepa_active:
              $ref: '#/components/schemas/FlexibleBoolean'
            sepa_iban: {type: string, maxLength: 64}
            sepa_iban_account_name: {type: string, maxLength: 255}
            sepa_bic: {type: string, maxLength: 16}
            sepa_mandate_id: {type: string, maxLength: 255}
            sepa_mandate_date:
              type: string
              description: yyyy-mm-dd; empty clears it.
              pattern: '^([0-9]{4}-[0-9]{2}-[0-9]{2})?$'
            sepa_sequence_type:
              type: string
              enum: [RCUR, FRST, OOFF, FNAL]
            si_identifier_type:
              type: string
              maxLength: 20
              description: The e-invoicing (Peppol) identifier scheme, such as 0106 for a Dutch chamber of commerce number.
            si_identifier: {type: string, maxLength: 255}
            invoice_workflow_id:
              $ref: '#/components/schemas/FlexibleIdentifier'
            estimate_workflow_id:
              $ref: '#/components/schemas/FlexibleIdentifier'
            archived:
              type: boolean
              description: MoneyHarpy extension. False brings an archived contact back.
            custom_fields_attributes:
              $ref: '#/components/schemas/custom_fields_attributes'
            contact_person:
              description: Adds a contact person with a new contact.
              $ref: '#/components/schemas/ContactPersonFields'
    ContactPersonFields:
      type: object
      additionalProperties: false
      properties:
        firstname: {type: string, maxLength: 255}
        lastname: {type: string, maxLength: 255}
        phone: {type: string, maxLength: 255}
        email: {type: string, maxLength: 255}
        department: {type: string, maxLength: 255}
    ContactPersonRequest:
      type: object
      required: [contact_person]
      additionalProperties: false
      properties:
        contact_person:
          $ref: '#/components/schemas/ContactPersonFields'
    NoteRequest:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note:
          type: object
          required: [note]
          additionalProperties: false
          properties:
            note:
              type: string
              maxLength: 10000
            todo:
              $ref: '#/components/schemas/FlexibleBoolean'
            assignee_id:
              $ref: '#/components/schemas/FlexibleIdentifier'
    GeneralJournalDocument:
      description: A Moneybird general journal document with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/general_journal_document_response'
        - type: object
          required: [id, administration_id, reference, date, version, general_journal_document_entries, notes, attachments, events, uri]
          properties:
            uri:
              type: string
              description: MoneyHarpy extension. Canonical path of this resource.
    GeneralJournalDocumentRequest:
      type: object
      required: [general_journal_document]
      additionalProperties: false
      properties:
        general_journal_document:
          type: object
          additionalProperties: false
          properties:
            reference:
              type: string
              maxLength: 255
            date:
              type: string
              format: date
            journal_type:
              type: string
              enum: [fiscal_year_ending, '']
            general_journal_document_entries_attributes:
              description: An array of rows, or an object of rows keyed by position, as Moneybird accepts.
              oneOf:
                - type: array
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/GeneralJournalDocumentRowInput'
                - type: object
                  additionalProperties:
                    $ref: '#/components/schemas/GeneralJournalDocumentRowInput'
        all_taxes:
          description: Accepted for compatibility.
          $ref: '#/components/schemas/FlexibleBoolean'
    GeneralJournalDocumentRowInput:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/FlexibleIdentifier'
        ledger_account_id:
          $ref: '#/components/schemas/FlexibleIdentifier'
        contact_id:
          $ref: '#/components/schemas/FlexibleIdentifier'
        project_id:
          $ref: '#/components/schemas/FlexibleIdentifier'
        tax_rate_id:
          description: Accepted for compatibility; journal entries post no VAT of their own.
          $ref: '#/components/schemas/FlexibleIdentifier'
        debit:
          $ref: '#/components/schemas/Money'
        credit:
          $ref: '#/components/schemas/Money'
        description:
          type: string
          maxLength: 1000
        row_order:
          oneOf:
            - type: integer
            - type: string
              pattern: '^[0-9]{1,6}$'
        _destroy:
          $ref: '#/components/schemas/FlexibleBoolean'
    PurchaseInvoice:
      description: A Moneybird purchase invoice with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/purchase_invoice_response'
        - $ref: '#/components/schemas/PurchaseDocumentFields'
    Receipt:
      description: A Moneybird receipt with MoneyHarpy extensions.
      allOf:
        - $ref: '#/components/schemas/receipt_response'
        - $ref: '#/components/schemas/PurchaseDocumentFields'
    PurchaseDocumentFields:
      type: object
      required: [id, administration_id, contact_id, date, state, entry_number, currency, details, payments, notes, attachments, events,
                 fiscal_allocations, total_price_excl_tax, total_price_incl_tax, total_paid, total_unpaid, version, uri]
      properties:
        uri:
          type: string
          description: MoneyHarpy extension. Canonical path of this resource.
        total_tax:
          type: string
          description: MoneyHarpy extension. The VAT charged; reverse-charged VAT is not part of it.
        total_paid:
          type: string
          description: MoneyHarpy extension. What payments settled.
        total_unpaid:
          type: string
          description: MoneyHarpy extension. What is still to be paid; negative for a revenue invoice.
        tax_totals:
          type: array
          description: MoneyHarpy extension. The VAT per rate.
          items:
            type: object
            required: [tax_rate_id, taxable_amount, tax_amount]
            properties:
              tax_rate_id:
                $ref: '#/components/schemas/Identifier'
              taxable_amount:
                type: string
              taxable_amount_base:
                type: string
              tax_amount:
                type: string
              tax_amount_base:
                type: string
    PurchaseDetailInput:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/FlexibleIdentifier'
        description:
          type: string
          maxLength: 10000
        period:
          type: string
          description: The days the line is about, as yyyymmdd..yyyymmdd; empty clears it.
          pattern: '^(\d{8}\.\.\d{8})?$'
        price:
          $ref: '#/components/schemas/Money'
        amount:
          description: The quantity, such as "2" or "1,5 hours"; it must start with a number.
          oneOf:
            - type: string
              maxLength: 255
            - type: number
        tax_rate_id:
          $ref: '#/components/schemas/FlexibleIdentifier'
        ledger_account_id:
          $ref: '#/components/schemas/FlexibleIdentifier'
        project_id:
          $ref: '#/components/schemas/FlexibleIdentifier'
        product_id:
          $ref: '#/components/schemas/FlexibleIdentifier'
        row_order:
          oneOf:
            - type: integer
            - type: string
              pattern: '^[0-9]{1,6}$'
        is_optional:
          description: Accepted for compatibility; every line of a document counts.
          $ref: '#/components/schemas/FlexibleBoolean'
        is_selected:
          description: Accepted for compatibility; every line of a document counts.
          $ref: '#/components/schemas/FlexibleBoolean'
        automated_tax_enabled:
          description: Accepted for compatibility.
          $ref: '#/components/schemas/FlexibleBoolean'
        _destroy:
          $ref: '#/components/schemas/FlexibleBoolean'
    FiscalAllocationInput:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/FlexibleIdentifier'
        ledger_account_id:
          $ref: '#/components/schemas/FlexibleIdentifier'
        private_ledger_account_id:
          $ref: '#/components/schemas/FlexibleIdentifier'
        percentage:
          description: A percentage such as "25" or "12.5".
          oneOf:
            - type: string
              maxLength: 10
            - type: number
        _destroy:
          $ref: '#/components/schemas/FlexibleBoolean'
    PurchaseDocumentInput:
      type: object
      additionalProperties: false
      properties:
        contact_id:
          description: The supplier; empty removes it.
          $ref: '#/components/schemas/FlexibleIdentifier'
        reference:
          type: string
          description: The document's number at the supplier.
          maxLength: 1000
        date:
          type: string
          format: date
        due_date:
          type: string
          description: yyyy-mm-dd; empty removes it.
          pattern: '^(\d{4}-\d{2}-\d{2})?$'
        currency:
          type: string
          maxLength: 3
        prices_are_incl_tax:
          $ref: '#/components/schemas/FlexibleBoolean'
        revenue_invoice:
          description: A purchase invoice the administration receives money on; it books the other way.
          $ref: '#/components/schemas/FlexibleBoolean'
        details_attributes:
          description: An array of lines, or an object of lines keyed by position.
          oneOf:
            - type: array
              maxItems: 500
              items:
                $ref: '#/components/schemas/PurchaseDetailInput'
            - type: object
              additionalProperties:
                $ref: '#/components/schemas/PurchaseDetailInput'
        fiscal_allocations_attributes:
